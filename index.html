<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fwrt — Trình vẽ lưu đồ</title>
<style>
  :root{
    --bg:#eef1f7; --panel:#ffffff; --border:#e3e7f0; --text:#1e2433;
    --muted:#7c869e; --accent:#4f46e5; --accent-soft:#eef0ff;
    --danger:#e11d48; --guide:#ec4899;
    --shadow:0 1px 3px rgba(20,30,60,.08), 0 8px 24px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;
  }
  #app{display:flex;flex-direction:column;height:100vh;}
  .topbar{
    height:54px;flex:0 0 54px;background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;gap:12px;z-index:20;box-shadow:0 1px 2px rgba(20,30,60,.04);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#ec4899 100%);
    color:#fff;font-weight:800;font-size:14px;letter-spacing:-.5px;
    box-shadow:0 4px 12px rgba(99,102,241,.35);
  }
  .brand .name{display:flex;flex-direction:column;line-height:1.05;}
  .brand .name b{font-size:15.5px;letter-spacing:-.3px;font-weight:800;}
  .brand .name small{font-size:10px;color:var(--muted);letter-spacing:.5px;font-weight:500;}
  .tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .divider{width:1px;height:22px;background:var(--border);margin:0 4px;}
  button{
    font-family:inherit;font-size:12.5px;font-weight:500;
    background:#fff;color:var(--text);border:1px solid var(--border);
    padding:7px 11px;border-radius:8px;cursor:pointer;
    transition:all .13s ease;display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;
  }
  button:hover{background:#f6f7fb;border-color:#cfd6e6;}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.28);}
  button.primary:hover{background:#4338ca;border-color:#4338ca;}
  button.icon{padding:7px 9px;font-size:14px;line-height:1;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.danger{background:#fff1f4;border-color:#fecdd6;color:var(--danger);width:100%;justify-content:center;margin-top:6px;}
  button.danger:hover{background:#ffe4ea;}
  .chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;padding:0 3px;}
  .chk input{accent-color:var(--accent);cursor:pointer;}
  #zoomLabel{font-size:12px;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums;}
  .body{display:flex;flex:1;min-height:0;}
  .palette{
    width:236px;flex:0 0 236px;background:var(--panel);
    border-right:1px solid var(--border);overflow-y:auto;padding:12px 12px 14px;
  }
  .pal-group{margin-bottom:8px;border-radius:10px;border:1px solid var(--border);overflow:hidden;background:#fff;}
  .pal-group-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 11px;cursor:pointer;font-size:11px;font-weight:700;
    letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
    background:#fafbfe;user-select:none;transition:background .12s;
  }
  .pal-group-header:hover{background:#f3f5fb;color:var(--accent);}
  .pal-group-header .chev{transition:transform .18s;font-size:10px;opacity:.7;}
  .pal-group.collapsed .pal-group-header .chev{transform:rotate(-90deg);}
  .pal-group.collapsed .pal-group-items{display:none;}
  .pal-group-items{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;}
  .pal-item{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:7px 3px 6px;border:1px solid var(--border);border-radius:9px;
    background:#fff;cursor:pointer;transition:all .13s ease;
  }
  .pal-item:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);box-shadow:0 4px 10px rgba(79,70,229,.12);}
  .pal-item svg{display:block;}
  .pal-item span{font-size:10px;color:var(--muted);text-align:center;line-height:1.15;}
  .pal-item:hover span{color:var(--accent);font-weight:600;}
  .hints{list-style:none;padding:0;margin:0;font-size:11.5px;color:var(--muted);line-height:1.65;}
  .hints li{padding-left:14px;position:relative;margin-bottom:5px;}
  .hints li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-weight:700;}
  .hints b{color:#4b5568;font-weight:600;}
  .canvas-wrap{
    flex:1;position:relative;overflow:hidden;
    background-color:#fbfcfe;
    background-image:radial-gradient(circle,#d8ddea 1px,transparent 1px);
    background-size:20px 20px;cursor:default;
  }
  #svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;}
  #svg.panning{cursor:grabbing !important;}
  #svg.linking{cursor:crosshair !important;}
  .node{cursor:move;}
  .node.locked{cursor:not-allowed;}
  .node path{transition:filter .12s;}
  .node:hover path.node-shape{filter:drop-shadow(0 3px 7px rgba(30,40,80,.16));}
  .port{cursor:crosshair;}
  .port .port-dot{opacity:0;transition:opacity .13s;pointer-events:none;}
  .node:hover .port .port-dot,
  .node.selected .port .port-dot,
  .port:hover .port-dot{opacity:1;}
  .port:hover .port-dot{fill:#4f46e5 !important;stroke:#4f46e5 !important;}
  .node.selected .sel-outline{fill:none;stroke:#4f46e5;stroke-width:2;stroke-dasharray:6 4;pointer-events:none;opacity:.85;}
  .lock-badge{pointer-events:none;}
  .edge .hit{stroke:transparent;stroke-width:18;fill:none;cursor:pointer;}
  .edge .line{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:filter .12s;}
  .edge:hover .line{filter:drop-shadow(0 0 4px rgba(79,70,229,.5));}
  .edge.selected .line{stroke:#4f46e5 !important;}
  .edge text{font-family:inherit;font-size:11.5px;fill:#475569;pointer-events:none;user-select:none;}
  .handle{fill:#fff;stroke:#4f46e5;stroke-width:1.5;cursor:nwse-resize;}
  .target-highlight{fill:none;stroke:#4f46e5;stroke-width:2.5;stroke-dasharray:8 5;pointer-events:none;}
  .guide-line{stroke:#ec4899;stroke-width:1;stroke-dasharray:4 3;pointer-events:none;}
  .node-editor{
    position:absolute;border:2px solid var(--accent);border-radius:8px;
    background:#fff;padding:6px 8px;font-family:inherit;font-size:13px;
    resize:none;outline:none;box-shadow:0 8px 30px rgba(79,70,229,.3);
    text-align:center;line-height:1.3;z-index:50;color:var(--text);
  }
  .zoombar{
    position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:10px;padding:6px 10px;
    box-shadow:var(--shadow);font-size:11.5px;color:var(--muted);
  }
  .zoombar b{color:#4b5568;font-weight:600;}
  .mode-indicator{
    position:absolute;top:14px;left:14px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:8px;padding:5px 10px;
    font-size:11.5px;color:var(--muted);box-shadow:var(--shadow);
    pointer-events:none;transition:opacity .2s;opacity:0;
  }
  .mode-indicator.show{opacity:1;}
  .minimap{
    position:absolute;right:14px;bottom:14px;width:200px;height:140px;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  }
  .minimap svg{width:100%;height:100%;display:block;}
  .minimap-viewport{fill:rgba(79,70,229,.10);stroke:#4f46e5;stroke-width:1.5;}
  .search-panel{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 10px 40px rgba(20,30,60,.16);padding:8px;
    display:none;z-index:30;width:340px;
  }
  .search-panel.show{display:block;}
  .search-panel input{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;width:100%;outline:none;color:var(--text);
  }
  .search-panel input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search-results{max-height:280px;overflow-y:auto;margin-top:6px;}
  .search-result{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:8px;}
  .search-result:hover{background:var(--accent-soft);color:var(--accent);}
  .search-result .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .search-result .meta{margin-left:auto;font-size:10.5px;color:var(--muted);}
  .search-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px;}
  .inspector{
    width:272px;flex:0 0 272px;background:var(--panel);
    border-left:1px solid var(--border);overflow-y:auto;padding:14px;
  }
  .insp-title{
    font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .insp-title:not(:first-child){margin-top:20px;}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
  .fld>span{font-size:11.5px;color:var(--muted);font-weight:500;}
  .fld input[type=text],.fld input[type=number],.fld textarea,.fld select{
    font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--border);
    border-radius:8px;background:#fafbfe;color:var(--text);outline:none;width:100%;
    transition:all .13s;resize:vertical;
  }
  .fld textarea{line-height:1.4;min-height:56px;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{
    border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft);
  }
  .fld input[type=color]{width:100%;height:34px;padding:3px;border:1px solid var(--border);border-radius:8px;background:#fafbfe;cursor:pointer;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .empty-state{color:var(--muted);font-size:12.5px;text-align:center;padding:44px 14px;line-height:1.8;}
  .empty-state .big{font-size:32px;display:block;margin-bottom:10px;opacity:.35;}
  .swatch-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
  .swatch{width:22px;height:22px;border-radius:6px;border:2px solid #fff;cursor:pointer;box-shadow:0 0 0 1px var(--border);transition:transform .12s;}
  .swatch:hover{transform:scale(1.15);}
  .align-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:8px;}
  .align-btn{
    padding:7px 0;border:1px solid var(--border);border-radius:7px;background:#fff;
    cursor:pointer;display:grid;place-items:center;color:#64748b;font-size:13px;
    transition:all .12s;
  }
  .align-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .seg{display:grid;grid-auto-flow:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fafbfe;}
  .seg button{border-radius:0;border:none;background:transparent;padding:6px 8px;font-size:12px;color:var(--muted);justify-content:center;}
  .seg button:hover{background:#f0f2f8;color:var(--text);}
  .seg button.active{background:var(--accent);color:#fff;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,60,.5);backdrop-filter:blur(3px);z-index:500;display:none;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:16px;box-shadow:0 24px 80px rgba(20,30,60,.35);max-width:560px;width:calc(100% - 32px);max-height:80vh;overflow-y:auto;animation:modalIn .18s ease-out;}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-header{padding:18px 22px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-header h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px;}
  .modal-body{padding:16px 22px 22px;}
  .shortcut-section{margin-bottom:16px;}
  .shortcut-section h3{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
  .shortcut-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--border);}
  .shortcut-row:last-child{border-bottom:none;}
  .shortcut-row kbd{background:#f1f3f8;border:1px solid #d8dde9;border-bottom-width:2px;border-radius:5px;padding:2px 7px;font-size:11px;font-family:ui-monospace,monospace;color:#4b5568;min-width:26px;text-align:center;}
  .modal-close{background:transparent;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1;}
  .modal-close:hover{background:#f0f2f8;color:var(--text);}
  .ctx-menu{
    position:fixed;background:#fff;border:1px solid var(--border);
    border-radius:11px;padding:6px;box-shadow:0 12px 44px rgba(20,30,60,.20), 0 2px 8px rgba(20,30,60,.08);
    min-width:240px;z-index:1000;display:none;font-size:12.5px;
    animation:ctxIn .12s ease-out;max-height:calc(100vh - 20px);overflow-y:auto;
  }
  @keyframes ctxIn{from{opacity:0;transform:scale(.96) translateY(-4px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .ctx-menu.show{display:block;}
  .ctx-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--text);user-select:none;transition:background .1s;}
  .ctx-item:hover{background:var(--accent-soft);color:var(--accent);}
  .ctx-item.danger{color:var(--danger);}
  .ctx-item.danger:hover{background:#fff1f4;}
  .ctx-item.disabled{opacity:.4;pointer-events:none;}
  .ctx-item .icon{width:16px;text-align:center;opacity:.75;font-size:13px;}
  .ctx-item .kbd{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:ui-monospace,monospace;}
  .ctx-item:hover .kbd{color:var(--accent);}
  .ctx-sep{height:1px;background:var(--border);margin:5px 4px;}
  .ctx-header{padding:8px 10px 5px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);}
  .ctx-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px 10px 8px;}
  .ctx-swatches .sw{width:100%;aspect-ratio:1;border-radius:6px;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);transition:transform .12s;}
  .ctx-swatches .sw:hover{transform:scale(1.14);}
  .ctx-swatches.recent{grid-template-columns:repeat(8,1fr);}
  .ctx-shapes{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px 6px 6px;max-height:260px;overflow-y:auto;}
  .ctx-shape{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:11.5px;color:var(--text);}
  .ctx-shape:hover{background:var(--accent-soft);color:var(--accent);}
  .ctx-shape svg{flex-shrink:0;}
  .ctx-buttons{display:grid;grid-auto-flow:column;gap:4px;padding:5px 8px 8px;grid-auto-columns:1fr;}
  .ctx-btn{
    border:1px solid var(--border);background:#fff;padding:6px 4px;
    border-radius:7px;cursor:pointer;display:grid;place-items:center;
    font-size:11.5px;color:var(--text);transition:all .12s;min-width:0;
    font-family:inherit;
  }
  .ctx-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .ctx-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .ctx-btn b{font-weight:800;}
  .ctx-btn i{font-style:italic;font-family:Georgia,serif;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#d3d9e6;border-radius:6px;border:2px solid var(--panel);}
  ::-webkit-scrollbar-thumb:hover{background:#b9c2d6;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">Fw</div>
      <div class="name">
        <b>Fwrt</b>
        <small>FLOWCHART EDITOR</small>
      </div>
    </div>
    <div class="tools">
      <button class="icon" id="btnUndo" title="Hoàn tác (Ctrl+Z)">↶</button>
      <button class="icon" id="btnRedo" title="Làm lại (Ctrl+Y)">↷</button>
      <button class="icon" id="btnSearch" title="Tìm kiếm (Ctrl+F)">🔍</button>
      <button class="icon" id="btnHelp" title="Trợ giúp (?)">?</button>
      <span class="divider"></span>
      <button class="icon" id="btnZoomOut" title="Thu nhỏ">−</button>
      <span id="zoomLabel">100%</span>
      <button class="icon" id="btnZoomIn" title="Phóng to">+</button>
      <button id="btnFit" title="Vừa khung (Ctrl+0)">Vừa khung</button>
      <span class="divider"></span>
      <label class="chk"><input type="checkbox" id="chkGrid" checked> Lưới</label>
      <label class="chk"><input type="checkbox" id="chkSnap"> Bám lưới</label>
      <label class="chk"><input type="checkbox" id="chkGuides" checked> Guides</label>
      <span class="divider"></span>
      <button id="btnNew" title="Tạo mới">Mới</button>
      <button id="btnOpen" title="Mở file .json">Mở</button>
      <button id="btnSave" title="Lưu file .json (Ctrl+S)">Lưu</button>
      <button id="btnSvg" title="Xuất SVG">SVG</button>
      <button id="btnPng" class="primary" title="Xuất ảnh PNG">⤓ PNG</button>
    </div>
  </header>

  <div class="body">
    <aside class="palette" id="palette"></aside>

    <main class="canvas-wrap" id="canvasWrap">
      <svg id="svg">
        <defs id="defs"></defs>
        <g id="viewport">
          <g id="edgesLayer"></g>
          <g id="nodesLayer"></g>
          <g id="overlayLayer"></g>
        </g>
      </svg>
      <div class="mode-indicator" id="modeIndicator"></div>
      <div class="zoombar">
        <span>Zoom: <b id="zoomLabel2">100%</b></span>
        <span>·</span>
        <span>Hình: <b id="statNodes">0</b></span>
        <span>·</span>
        <span>Nối: <b id="statEdges">0</b></span>
      </div>
      <div class="minimap" id="minimap"><svg id="minimapSvg"></svg></div>
      <div class="search-panel" id="searchPanel">
        <input type="text" id="searchInput" placeholder="Tìm hình theo nội dung…">
        <div class="search-results" id="searchResults"></div>
      </div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>
</div>

<div class="modal-bg" id="helpModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Phím tắt & Hướng dẫn</h2>
      <button class="modal-close" id="helpClose">✕</button>
    </div>
    <div class="modal-body" id="helpBody"></div>
  </div>
</div>

<div class="ctx-menu" id="ctxMenu"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<script>
/* ==================================================================
   Fwrt — Flowchart Editor v5
   ================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const FONT = "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
const GRID = 20;
const MIN_FONT = 8;
const MAX_FONT = 96;

const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'n' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- SHAPES ---------- */
const SHAPES = {
  oval:          { label: 'Bầu dục',    group: 'Cơ bản',     w: 152, h: 56,  fill: '#dcfce7', stroke: '#16a34a' },
  rect:          { label: 'Chữ nhật',   group: 'Cơ bản',     w: 172, h: 70,  fill: '#dbeafe', stroke: '#2563eb' },
  diamond:       { label: 'Thoi',       group: 'Cơ bản',     w: 164, h: 104, fill: '#fef3c7', stroke: '#d97706' },

function shapePaths(type, x, y, w, h) {
  const rr = rad => {
    rad = Math.min(rad, w / 2, h / 2);
    return `M ${x + rad} ${y} H ${x + w - rad} A ${rad} ${rad} 0 0 1 ${x + w} ${y + rad} ` +
           `V ${y + h - rad} A ${rad} ${rad} 0 0 1 ${x + w - rad} ${y + h} ` +
           `H ${x + rad} A ${rad} ${rad} 0 0 1 ${x} ${y + h - rad} ` +
           `V ${y + rad} A ${rad} ${rad} 0 0 1 ${x + rad} ${y} Z`;
  };
  const cx = x + w / 2, cy = y + h / 2;
  switch (type) {
    case 'oval': return [rr(h / 2)];
    case 'rect': return [rr(10)];
    case 'diamond': return [`M ${cx} ${y} L ${x + w} ${cy} L ${cx} ${y + h} L ${x} ${cy} Z`];
    case 'parallelogram': {
      const o = Math.min(w * 0.18, 26);
      return [`M ${x + o} ${y} L ${x + w} ${y} L ${x + w - o} ${y + h} L ${x} ${y + h} Z`];
    }
    case 'hexagon': {
      const o = Math.min(w * 0.15, 26);
      return [`M ${x + o} ${y} L ${x + w - o} ${y} L ${x + w} ${cy} L ${x + w - o} ${y + h} L ${x + o} ${y + h} L ${x} ${cy} Z`];
    }
    case 'trapezoid': {
      const o = Math.min(w * 0.12, 22);
      return [`M ${x} ${y} L ${x + w} ${y} L ${x + w - o} ${y + h} L ${x + o} ${y + h} Z`];
    }
    case 'document': {
      const k = h * 0.22;
      return [`M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h - k} ` +
              `C ${x + w * 0.72} ${y + h + k * 0.9} ${x + w * 0.28} ${y + h - k * 1.9} ${x} ${y + h - k} Z`];
    }
    case 'cylinder': {
      const ry = Math.min(h * 0.16, 18), rx = w / 2;
      return [
        `M ${x} ${y + ry} L ${x} ${y + h - ry} A ${rx} ${ry} 0 0 0 ${x + w} ${y + h - ry} ` +
        `L ${x + w} ${y + ry} A ${rx} ${ry} 0 0 1 ${x} ${y + ry} Z`,
        `M ${x} ${y + ry} A ${rx} ${ry} 0 0 0 ${x + w} ${y + ry}`
      ];
    }
    case 'circle': {
      const rx = w / 2, ry = h / 2;
      return [`M ${x} ${cy} A ${rx} ${ry} 0 1 1 ${x + w} ${cy} A ${rx} ${ry} 0 1 1 ${x} ${cy} Z`];
    }
    case 'note': {
      const f = Math.min(w, h) * 0.28;
      return [
        `M ${x} ${y} L ${x + w - f} ${y} L ${x + w} ${y + f} L ${x + w} ${y + h} L ${x} ${y + h} Z`,
        `M ${x + w - f} ${y} L ${x + w - f} ${y + f} L ${x + w} ${y + f}`
      ];
    }
    case 'predefined': {
      const off = w * 0.11;
      return [
        rr(8),
        `M ${x + off} ${y} L ${x + off} ${y + h}`,
        `M ${x + w - off} ${y} L ${x + w - off} ${y + h}`
      ];
    }
    case 'pentagon': {
      const f = h * 0.35;
      return [`M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h - f} L ${cx} ${y + h} L ${x} ${y + h - f} Z`];
    }
    case 'annotation': {
      const ox = w * 0.20;
      return [`M ${x + w} ${y} L ${x + ox} ${y} L ${x + ox} ${y + h} L ${x + w} ${y + h}`];
    }
    case 'display': {
      const c = w * 0.15;
      return [`M ${x + c} ${y} C ${x + c} ${y + h * 0.4} ${x} ${y + h * 0.6} ${x} ${y + h} ` +
              `L ${x + w} ${y + h} C ${x + w} ${y + h * 0.6} ${x + w - c} ${y + h * 0.4} ${x + w - c} ${y} Z`];
    }
    case 'delay': {
      const r = h / 2;
      return [`M ${x} ${y} L ${x + w - r} ${y} A ${r} ${r} 0 0 1 ${x + w - r} ${y + h} L ${x} ${y + h} Z`];
    }
    case 'manual_input': {
      const s = h * 0.25;
      return [`M ${x} ${y + s} L ${x + w} ${y} L ${x + w} ${y + h} L ${x} ${y + h} Z`];
    }
    case 'internal_storage': {
      return [rr(0), `M ${x + w * 0.2} ${y} L ${x + w * 0.2} ${y + h}`, `M ${x} ${y + h * 0.25} L ${x + w} ${y + h * 0.25}`];
    }
    case 'stored_data': {
      const c = w * 0.15;
      return [`M ${x + c} ${y} L ${x + w} ${y} L ${x + w} ${y + h} L ${x + c} ${y + h} ` +
              `C ${x - c * 0.3} ${y + h * 0.75} ${x - c * 0.3} ${y + h * 0.25} ${x + c} ${y} Z`];
    }
    case 'loop_limit': {
      const s = w * 0.15;
      return [`M ${x} ${y} L ${x + w} ${y} L ${x + w - s} ${y + h} L ${x + s} ${y + h} Z`];
    }
    case 'merge': return [`M ${x} ${y} L ${x + w} ${y} L ${cx} ${y + h} Z`];
    case 'or_node': {
      const rx = w / 2, ry = h / 2, s = Math.min(w, h) * 0.22;
      return [
        `M ${x} ${cy} A ${rx} ${ry} 0 1 1 ${x + w} ${cy} A ${rx} ${ry} 0 1 1 ${x} ${cy} Z`,
        `M ${cx - s} ${cy} L ${cx + s} ${cy}`,
        `M ${cx} ${cy - s} L ${cx} ${cy + s}`
      ];
    }
    case 'summing': {
      const rx = w / 2, ry = h / 2, s = Math.min(w, h) * 0.22;
      return [
        `M ${x} ${cy} A ${rx} ${ry} 0 1 1 ${x + w} ${cy} A ${rx} ${ry} 0 1 1 ${x} ${cy} Z`,
        `M ${cx - s} ${cy - s} L ${cx + s} ${cy + s}`,
        `M ${cx + s} ${cy - s} L ${cx - s} ${cy + s}`
      ];
    }
  }
  return [rr(10)];
}

/* ---------- Shape inner padding (for text) ---------- */
function shapeInnerPad(type, w, h) {
  const m = Math.min(w, h);
  switch (type) {
    case 'diamond':        return m * 0.28;
    case 'circle':         return m * 0.22;
    case 'oval':           return Math.min(w * 0.14, h * 0.14);
    case 'hexagon':        return m * 0.19;
    case 'parallelogram':  return m * 0.19;
    case 'trapezoid':      return m * 0.14;
    case 'pentagon':       return h * 0.22;
    case 'merge':          return m * 0.24;
    case 'or_node':        return m * 0.24;
    case 'summing':        return m * 0.24;
    case 'delay':          return h * 0.10;
    case 'display':        return m * 0.16;
    case 'manual_input':   return h * 0.16;
    case 'predefined':     return w * 0.14;
    case 'annotation':     return w * 0.24;
    case 'internal_storage': return w * 0.24;
    case 'stored_data':    return w * 0.20;
    case 'loop_limit':     return w * 0.14;
    case 'note':           return m * 0.10;
    case 'document':       return m * 0.12;
    default:               return 14;
  }
}

const markerCache = new Map();
let markerCounter = 0;
function getMarker(color) {
  if (markerCache.has(color)) return markerCache.get(color);
  const safe = color.replace(/[^a-z0-9]/gi, '');
  const id = 'ar-' + safe + '-' + (markerCounter++);

/* ---------- Text wrapping & auto-fit ---------- */
const _mctx = document.createElement('canvas').getContext('2d');
function setMeasureFont(fontSize, weight, style) {
  _mctx.font = `${style || ''} ${weight || 500} ${fontSize}px ${FONT}`.trim();
}
function measureTextWidth(text, fontSize, weight, style) {
  setMeasureFont(fontSize, weight, style);
  return _mctx.measureText(text).width;
}
function wrapText(text, maxWidth, fontSize, weight, style) {
  setMeasureFont(fontSize, weight, style);
  const out = [];
  String(text ?? '').split('\n').forEach(para => {
    if (!para) { out.push(''); return; }
    const words = para.split(/\s+/);
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (_mctx.measureText(test).width > maxWidth && line) { out.push(line); line = w; }
      else line = test;
    }
    out.push(line);
  });
  return out.length ? out : [''];
}

/* Auto-fit: shrink font until text fits inside shape bounds */
function computeTextLayout(n) {
  if (!n.text || !n.text.length) return null;

  const weight = n.bold ? 700 : 500;
  const fstyle = n.italic ? 'italic' : '';
  const pad = shapeInnerPad(n.type, n.w, n.h);
  const maxW = Math.max(16, n.w - pad * 2);
  const maxH = Math.max(12, n.h - pad * 2);

  let fs = clamp(n.fontSize || 14, MIN_FONT, MAX_FONT);
  const startFs = fs;
  let lines;

  if (n.autoFit !== false) {
    /* shrink until fits */
    while (fs > MIN_FONT) {
      lines = wrapText(n.text, maxW, fs, weight, fstyle);
      const totalH = lines.length * fs * 1.28;
      if (totalH <= maxH) break;
      fs -= 0.5;
    }
    if (fs < MIN_FONT) fs = MIN_FONT;
  }
  lines = wrapText(n.text, maxW, fs, weight, fstyle);

  return { fs, lines, weight, fstyle, lineH: fs * 1.3, effFs: fs, startFs };
}

/* ---------- Geometry ---------- */
function portPos(n, side) {
  switch (side) {
    case 'top':    return { x: n.x + n.w / 2, y: n.y };
    case 'right':  return { x: n.x + n.w,     y: n.y + n.h / 2 };
    case 'bottom': return { x: n.x + n.w / 2, y: n.y + n.h };
    case 'left':   return { x: n.x,           y: n.y + n.h / 2 };
  }
  return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
}
function autoSides(a, b) {
  const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
  const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
  if (Math.abs(dx) > Math.abs(dy) * 1.15) return dx > 0 ? ['right', 'left'] : ['left', 'right'];
  return dy > 0 ? ['bottom', 'top'] : ['top', 'bottom'];
}
function shiftPt(p, side, d) {
  switch (side) {
    case 'top':    return { x: p.x, y: p.y - d };
    case 'bottom': return { x: p.x, y: p.y + d };
    case 'left':   return { x: p.x - d, y: p.y };
    case 'right':  return { x: p.x + d, y: p.y };
  }
  return p;
}
function buildEdgePath(p1, s1, p2, s2, routing) {
  if (routing === 'straight') {
    return { d: `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`, mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 } };
  }
  if (routing === 'orthogonal') {
    const gap = 28;
    const e1 = shiftPt(p1, s1, gap);
    const e2 = shiftPt(p2, s2, gap);
    const h1 = s1 === 'left' || s1 === 'right';
    const h2 = s2 === 'left' || s2 === 'right';
    const pts = [p1, e1];
    if (h1 && h2) {
      const mx = (e1.x + e2.x) / 2;
      pts.push({ x: mx, y: e1.y }, { x: mx, y: e2.y });
    } else if (!h1 && !h2) {
      const my = (e1.y + e2.y) / 2;
      pts.push({ x: e1.x, y: my }, { x: e2.x, y: my });
    } else if (h1) {
      pts.push({ x: e2.x, y: e1.y });
    } else {
      pts.push({ x: e1.x, y: e2.y });
    }
    pts.push(e2, p2);
    const filt = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const l = filt[filt.length - 1];
      if (Math.abs(pts[i].x - l.x) > 0.5 || Math.abs(pts[i].y - l.y) > 0.5) filt.push(pts[i]);
    }
    let dstr = `M ${filt[0].x} ${filt[0].y}`;
    for (let i = 1; i < filt.length; i++) dstr += ` L ${filt[i].x} ${filt[i].y}`;
    let totalLen = 0;
    for (let i = 1; i < filt.length; i++) totalLen += Math.hypot(filt[i].x - filt[i - 1].x, filt[i].y - filt[i - 1].y);
    let acc = 0, mid = filt[0];
    for (let i = 1; i < filt.length; i++) {
      const seg = Math.hypot(filt[i].x - filt[i - 1].x, filt[i].y - filt[i - 1].y);
      if (acc + seg >= totalLen / 2) {
        const t = (totalLen / 2 - acc) / seg;
        mid = { x: filt[i - 1].x + (filt[i].x - filt[i - 1].x) * t, y: filt[i - 1].y + (filt[i].y - filt[i - 1].y) * t };
        break;
      }
      acc += seg;
    }
    return { d: dstr, mid };
  }
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const d = clamp(dist * 0.42, 34, 160);
  const c1 = shiftPt(p1, s1, d);
  const c2 = shiftPt(p2, s2, d);
  return {
    d: `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${p2.x} ${p2.y}`,
    mid: { x: (p1.x + 3 * c1.x + 3 * c2.x + p2.x) / 8, y: (p1.y + 3 * c1.y + 3 * c2.y + p2.y) / 8 }
  };
}
const getNode = id => nodes.find(n => n.id === id);
const getEdge = id => edges.find(e => e.id === id);

/* ---------- Recent colors ---------- */
function pushRecentColor(fill, stroke) {
  const key = fill + '|' + stroke;
  recentColors = recentColors.filter(c => c.fill + '|' + c.stroke !== key);
  recentColors.unshift({ fill, stroke });
  recentColors = recentColors.slice(0, 16);
  try { localStorage.setItem('fwrt-recent-colors', JSON.stringify(recentColors)); } catch (_) {}
}

function makeNodeEl(n) {
  const g = svgEl('g', {
    class: 'node' + (selected.nodes.has(n.id) ? ' selected' : '') + (n.locked ? ' locked' : ''),
    'data-id': n.id
  });

  if (linkTargetId === n.id) {
    const hp = shapePaths(n.type, n.x - 5, n.y - 5, n.w + 10, n.h + 10)[0];
    g.appendChild(svgEl('path', { d: hp, class: 'target-highlight' }));
  }

  const paths = shapePaths(n.type, n.x, n.y, n.w, n.h);
  paths.forEach((d, i) => {
    g.appendChild(svgEl('path', {
      d, class: i === 0 ? 'node-shape' : '',
      fill: i === 0 ? n.fill : 'none',
      stroke: n.stroke, 'stroke-width': n.strokeWidth || 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round'
    }));
  });

  if (selected.nodes.has(n.id)) {
    const b = shapePaths(n.type, n.x - 3, n.y - 3, n.w + 6, n.h + 6)[0];
    g.appendChild(svgEl('path', { d: b, class: 'sel-outline' }));
  }

  /* text with auto-fit */
  const layout = computeTextLayout(n);
  if (layout) {
    const { fs, lines, weight, fstyle, lineH } = layout;
    const totalH = (lines.length - 1) * lineH;
    const vAlign = n.vAlign || 'middle';
    let startY = n.y + n.h / 2 - totalH / 2;
    if (vAlign === 'top') startY = n.y + Math.max(8, shapeInnerPad(n.type, n.w, n.h) * 0.5);
    else if (vAlign === 'bottom') startY = n.y + n.h - Math.max(8, shapeInnerPad(n.type, n.w, n.h) * 0.5) - totalH;

    const hAlign = n.hAlign || 'center';
    const pad = shapeInnerPad(n.type, n.w, n.h);
    let tx = n.x + n.w / 2, anchor = 'middle';
    if (hAlign === 'left') { tx = n.x + pad; anchor = 'start'; }

/* ---------- MINIMAP ---------- */
function drawMinimap() {
  const W = minimap.clientWidth || 200;
  const H = minimap.clientHeight || 140;
  minimapSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  minimapSvg.textContent = '';

  }
  const b = contentBounds();
  const pad = 12;
  const s = Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h);
  const ox = (W - b.w * s) / 2 - b.x * s;
  const oy = (H - b.h * s) / 2 - b.y * s;

      fill: isSel ? '#4f46e5' : (n.fill === 'transparent' ? '#e3e7f0' : n.fill),
      stroke: isSel ? '#4f46e5' : (n.stroke || '#7c869e'),
      'stroke-width': 0.8
    }));

  const vx1 = (0 - view.x) / view.k;
  const vy1 = (0 - view.y) / view.k;

    class: 'minimap-viewport',

function centerFromMinimap(e) {

  const W = r.width, H = r.height;
  const b = contentBounds();
  const pad = 12;
  const s = Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h);

/* ---------- History ---------- */
let history = [], hIndex = -1;

  history = history.slice(0, hIndex + 1);
  history.push(s);
  if (history.length > 150) history.shift();
  hIndex = history.length - 1;
  updateUndoButtons();

}
function applySnapshot(s) {
  const d = JSON.parse(s);
  nodes = d.nodes; edges = d.edges;
  selected.nodes.clear(); selected.edges.clear();
  render();
}
function undo() { if (hIndex > 0) { hIndex--; applySnapshot(history[hIndex]); updateUndoButtons(); } }
function redo() { if (hIndex < history.length - 1) { hIndex++; applySnapshot(history[hIndex]); updateUndoButtons(); } }
function updateUndoButtons() {

/* ---------- Node ops ---------- */
function addNode(type, cx, cy, text) {
  const s = SHAPES[type];
  const n = {
    id: uid(), type,
    x: Math.round(cx - s.w / 2), y: Math.round(cy - s.h / 2),
    w: s.w, h: s.h,
    text: text !== undefined ? text : '',
    fill: s.fill, stroke: s.stroke,
    textColor: '#1e2433', fontSize: 14, strokeWidth: 2,
    bold: false, italic: false, autoFit: true,
    hAlign: 'center', vAlign: 'middle',
    locked: false
  };
  if (snapToGrid) { n.x = Math.round(n.x / GRID) * GRID; n.y = Math.round(n.y / GRID) * GRID; }
  nodes.push(n);
  return n;
}
function deleteSelection() {

  const delNodes = new Set(selected.nodes);
  edges = edges.filter(e => !delNodes.has(e.from) && !delNodes.has(e.to) && !selected.edges.has(e.id));
  nodes = nodes.filter(n => !delNodes.has(n.id));

  render(); pushHistory();
}
function duplicateSelection() {
  if (!selected.nodes.size) return;
  const map = new Map();
  const newIds = [];
  [...selected.nodes].forEach(id => {
    const n = getNode(id);
    if (!n) return;
    const c = JSON.parse(JSON.stringify(n));
    c.id = uid(); c.x += 32; c.y += 32;
    map.set(id, c.id);
    nodes.push(c); newIds.push(c.id);
  });
  edges.filter(e => map.has(e.from) && map.has(e.to)).forEach(e => {
    edges.push({ ...e, id: uid(), from: map.get(e.from), to: map.get(e.to) });
  });
  selected.nodes.clear();
  newIds.forEach(i => selected.nodes.add(i));
  render(); pushHistory();
}

}

function bringToFront(ids) {
  const set = new Set(ids);
  const moved = nodes.filter(n => set.has(n.id));
  nodes = nodes.filter(n => !set.has(n.id)).concat(moved);
  render(); pushHistory();
}
function sendToBack(ids) {
  const set = new Set(ids);
  const moved = nodes.filter(n => set.has(n.id));
  nodes = moved.concat(nodes.filter(n => !set.has(n.id)));
  render(); pushHistory();
}
function bringForward(ids) {
  const set = new Set(ids);
  for (let i = nodes.length - 2; i >= 0; i--) {
    if (set.has(nodes[i].id) && !set.has(nodes[i + 1].id)) [nodes[i], nodes[i + 1]] = [nodes[i + 1], nodes[i]];
  }
  render(); pushHistory();
}
function sendBackward(ids) {
  const set = new Set(ids);
  for (let i = 1; i < nodes.length; i++) {
    if (set.has(nodes[i].id) && !set.has(nodes[i - 1].id)) [nodes[i], nodes[i - 1]] = [nodes[i - 1], nodes[i]];
  }
  render(); pushHistory();

function alignNodes(mode) {
  const sel = [...selected.nodes].map(getNode).filter(Boolean);
  if (sel.length < 2) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  let sumCx = 0, sumCy = 0;
  sel.forEach(n => {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x + n.w);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y + n.h);
    sumCx += n.x + n.w / 2; sumCy += n.y + n.h / 2;
  });
  const cx = sumCx / sel.length, cy = sumCy / sel.length;
  switch (mode) {
    case 'left': sel.forEach(n => n.x = minX); break;
    case 'hcenter': sel.forEach(n => n.x = cx - n.w / 2); break;
    case 'right': sel.forEach(n => n.x = maxX - n.w); break;
    case 'top': sel.forEach(n => n.y = minY); break;
    case 'vcenter': sel.forEach(n => n.y = cy - n.h / 2); break;
    case 'bottom': sel.forEach(n => n.y = maxY - n.h); break;
    case 'distH': {
      if (sel.length < 3) return;
      const sorted = [...sel].sort((a, b) => a.x - b.x);
      const totalW = sorted.reduce((s, n) => s + n.w, 0);
      const span = maxX - minX;
      const gap = (span - totalW) / (sorted.length - 1);
      let x = minX;
      sorted.forEach(n => { n.x = x; x += n.w + gap; });
      break;
    }
    case 'distV': {
      if (sel.length < 3) return;
      const sorted = [...sel].sort((a, b) => a.y - b.y);
      const totalH = sorted.reduce((s, n) => s + n.h, 0);
      const span = maxY - minY;
      const gap = (span - totalH) / (sorted.length - 1);
      let y = minY;
      sorted.forEach(n => { n.y = y; y += n.h + gap; });
      break;
    }
  }
  render(); pushHistory();
}

    const base = SHAPES[n.type];
    n.w = Math.round(base.w * preset.factor);

  flashIndicator(`Đã đổi kích thước · ${sizeKey}`);
}

/* ---------- Alignment guides ---------- */
function computeGuides(draggedNodes) {
  const threshold = 6;
  const draggedIds = new Set(draggedNodes.map(n => n.id));
  const others = nodes.filter(n => !draggedIds.has(n.id));
  const guides = [];
  const seenV = new Set(), seenH = new Set();

  for (const dn of draggedNodes) {
    const dnLeft = dn.x, dnCx = dn.x + dn.w / 2, dnRight = dn.x + dn.w;
    const dnTop = dn.y, dnCy = dn.y + dn.h / 2, dnBottom = dn.y + dn.h;

    for (const o of others) {
      const oLeft = o.x, oCx = o.x + o.w / 2, oRight = o.x + o.w;
      const oTop = o.y, oCy = o.y + o.h / 2, oBottom = o.y + o.h;

      [[dnLeft, oLeft], [dnCx, oCx], [dnRight, oRight]].forEach(([dv, ov]) => {
        if (Math.abs(dv - ov) < threshold && !seenV.has(ov)) {
          seenV.add(ov);
          guides.push({ type: 'v', x: ov, y1: Math.min(dnTop, oTop) - 20, y2: Math.max(dnBottom, oBottom) + 20 });
        }
      });
      [[dnTop, oTop], [dnCy, oCy], [dnBottom, oBottom]].forEach(([dv, ov]) => {
        if (Math.abs(dv - ov) < threshold && !seenH.has(ov)) {
          seenH.add(ov);
          guides.push({ type: 'h', y: ov, x1: Math.min(dnLeft, oLeft) - 20, x2: Math.max(dnRight, oRight) + 20 });
        }
      });
    }
  }
  return guides;
}

    if (e.shiftKey) {
      if (selected.nodes.has(id)) selected.nodes.delete(id);
      else selected.nodes.add(id);
    } else if (!selected.nodes.has(id)) {
      clearSelection();
      selected.nodes.add(id);
    }
    selected.edges.clear();
    render();
    if (e.altKey && selected.nodes.size) {
      duplicateSelection();
    }
    drag = {
      type: 'node', start: toWorld(e), moved: false,
      origins: [...selected.nodes].map(i => { const n = getNode(i); return { id: i, x: n.x, y: n.y }; })
    };
    safeCapture(e.pointerId);
    return;
  }
  if (edgeEl) {
    e.preventDefault();
    const id = edgeEl.dataset.id;
    if (!e.shiftKey) clearSelection();
    selected.edges.add(id);
    selected.nodes.clear();
    render();
    return;
  }
  if (e.button === 0 && isEmpty && e.shiftKey) {
    const p = toWorld(e);
    drag = { type: 'rubber', rect: { x1: p.x, y1: p.y, x2: p.x, y2: p.y }, additive: false };
    safeCapture(e.pointerId);
    render();
  }
}
function safeCapture(pointerId) { try { svg.setPointerCapture(pointerId); } catch (_) {} }

function onPointerMove(e) {
  if (!drag) return;
  if (drag.type === 'pan') {
    view.x = drag.ox + (e.clientX - drag.sx);
    view.y = drag.oy + (e.clientY - drag.sy);
    render(true);
    return;
  }
  const p = toWorld(e);
  if (drag.type === 'node') {
    drag.moved = true;
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    drag.origins.forEach(o => {
      const n = getNode(o.id);
      if (!n || n.locked) return;
      let nx = o.x + dx, ny = o.y + dy;
      if (snapToGrid) { nx = Math.round(nx / GRID) * GRID; ny = Math.round(ny / GRID) * GRID; }
      n.x = nx; n.y = ny;
    });
    /* compute & apply alignment guides */
    if (chkGuides.checked) {
      const draggedNodes = [...selected.nodes].map(getNode).filter(Boolean);
      currentGuides = computeGuides(draggedNodes);
      /* snap */
      if (currentGuides.length && !snapToGrid) {
        const threshold = 5;
        draggedNodes.forEach(dn => {
          currentGuides.forEach(gd => {
            if (gd.type === 'v') {
              const dv = [dn.x, dn.x + dn.w / 2, dn.x + dn.w];
              dv.forEach(v => { if (Math.abs(v - gd.x) < threshold) dn.x += gd.x - v; });
            } else {
              const dv = [dn.y, dn.y + dn.h / 2, dn.y + dn.h];
              dv.forEach(v => { if (Math.abs(v - gd.y) < threshold) dn.y += gd.y - v; });
            }
          });
        });
      }
    } else currentGuides = [];
    render(true);
    return;
  }
  if (drag.type === 'resize') {
    drag.moved = true;
    const n = getNode(drag.id);
    if (!n) return;
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    const o = drag.orig;
    let x = o.x, y = o.y, w = o.w, h = o.h;
    if (drag.handle.includes('e')) w = Math.max(44, o.w + dx);
    if (drag.handle.includes('s')) h = Math.max(34, o.h + dy);
    if (drag.handle.includes('w')) { w = Math.max(44, o.w - dx); x = o.x + (o.w - w); }
    if (drag.handle.includes('n')) { h = Math.max(34, o.h - dy); y = o.y + (o.h - h); }
    if (snapToGrid) {
      x = Math.round(x / GRID) * GRID; y = Math.round(y / GRID) * GRID;
      w = Math.round(w / GRID) * GRID; h = Math.round(h / GRID) * GRID;
    }
    Object.assign(n, { x, y, w, h });
    render(true);
    return;
  }
  if (drag.type === 'link') {
    drag.cursor = p;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = el && el.closest ? el.closest('.node') : null;
    const target = (tgt && tgt.dataset.id !== drag.from) ? tgt.dataset.id : null;
    linkTargetId = target;
    render(true);
    return;
  }
  if (drag.type === 'rubber') {
    drag.rect.x2 = p.x; drag.rect.y2 = p.y;
    render(true);
    return;
  }
}

function onPointerUp(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  currentGuides = [];
  svg.classList.remove('panning', 'linking');
  try { svg.releasePointerCapture(e.pointerId); } catch (_) {}

  if (d.type === 'node' || d.type === 'resize') {
    if (d.moved) pushHistory();
    render();
    return;
  }
  if (d.type === 'link') {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgtNode = el && el.closest ? el.closest('.node') : null;
    const tgtPort = el && el.closest ? el.closest('.port') : null;
    let targetId = null, targetSide = 'auto';
    if (tgtPort) { targetId = tgtPort.dataset.node; targetSide = tgtPort.dataset.side; }
    else if (tgtNode) { targetId = tgtNode.dataset.id; }
    linkTargetId = null;
    if (targetId && targetId !== d.from) {
      addEdge(d.from, targetId, d.fromSide, targetSide);
      pushHistory();
    } else if (!targetId) {
      const src = getNode(d.from);
      const p = d.cursor;
      const srcPort = portPos(src, d.fromSide === 'auto' ? 'right' : d.fromSide);
      const dist = Math.hypot(p.x - srcPort.x, p.y - srcPort.y);
      if (dist > 30) {
        const nn = addNode('rect', p.x, p.y);
        if (snapToGrid) { nn.x = Math.round(nn.x / GRID) * GRID; nn.y = Math.round(nn.y / GRID) * GRID; }
        addEdge(d.from, nn.id, d.fromSide, 'auto');
        clearSelection();
        selected.nodes.add(nn.id);
        pushHistory();
      }
    }
    render();
    return;
  }
  if (d.type === 'rubber') {
    const { x1, y1, x2, y2 } = d.rect;
    const rx1 = Math.min(x1, x2), rx2 = Math.max(x1, x2);
    const ry1 = Math.min(y1, y2), ry2 = Math.max(y1, y2);
    if (rx2 - rx1 > 4 || ry2 - ry1 > 4) {
      if (!d.additive) clearSelection();
      nodes.forEach(n => {
        if (n.x < rx2 && n.x + n.w > rx1 && n.y < ry2 && n.y + n.h > ry1) selected.nodes.add(n.id);
      });
    }
    render();
    return;
  }
  render();
}

function addEdge(from, to, fromSide, toSide) {
  if (from === to) return;
  const dup = edges.find(e => e.from === from && e.to === to &&
    (e.fromSide || 'auto') === (fromSide || 'auto') &&
    (e.toSide || 'auto') === (toSide || 'auto'));
  if (dup) return;
  edges.push({
    id: uid(), from, to,
    fromSide: fromSide || 'auto', toSide: toSide || 'auto',
    label: '', color: '#7c869e', width: 2, dashed: false,
    arrowEnd: true, arrowStart: false, routing: 'curve'
  });
}

svg.addEventListener('dblclick', e => {
  const nodeEl = closestOf(e.target, '.node');
  if (nodeEl) {
    const n = getNode(nodeEl.dataset.id);
    if (n && !n.locked) startTextEdit(n);
    return;
  }
  const edgeEl = closestOf(e.target, '.edge');
  if (edgeEl) {
    const ed = getEdge(edgeEl.dataset.id);
    if (ed) {
      const v = prompt('Nhãn cho đường nối:', ed.label || '');
      if (v !== null) { ed.label = v; render(); pushHistory(); }
    }
    return;
  }
  const p = toWorld(e);
  const n = addNode('rect', p.x, p.y);
  clearSelection();
  selected.nodes.add(n.id);
  render(); pushHistory();
});

function startTextEdit(n) {
  const ta = document.createElement('textarea');
  ta.className = 'node-editor';
  ta.value = n.text;
  ta.placeholder = 'Nhập…';
  const sx = view.x + n.x * view.k;
  const sy = view.y + n.y * view.k;
  ta.style.left = sx + 'px';
  ta.style.top = sy + 'px';
  ta.style.width = Math.max(70, n.w * view.k) + 'px';
  ta.style.height = Math.max(34, n.h * view.k) + 'px';
  ta.style.fontSize = Math.max(10, (n.fontSize || 14) * view.k) + 'px';
  if (n.bold) ta.style.fontWeight = '700';
  if (n.italic) ta.style.fontStyle = 'italic';
  canvasWrap.appendChild(ta);
  ta.focus(); ta.select();
  let done = false;
  const commit = () => {
    if (done) return;
    done = true;
    n.text = ta.value;
    ta.remove();
    render(); pushHistory();
  };
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Escape') { done = true; ta.remove(); render(); }
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); commit(); }
  });
}

canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const oldK = view.k;
  const factor = Math.exp(-e.deltaY * 0.0016);
  const k = clamp(oldK * factor, 0.12, 4);
  view.x = mx - (mx - view.x) * (k / oldK);
  view.y = my - (my - view.y) * (k / oldK);
  view.k = k;
  render(true);
}, { passive: false });

/* ==================================================================
   CONTEXT MENU (enhanced)
   ================================================================== */
function hideCtxMenu() { ctxMenu.classList.remove('show'); ctxMenu.innerHTML = ''; }
document.addEventListener('pointerdown', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); }, true);
svg.addEventListener('contextmenu', e => {
  e.preventDefault();
  const t = e.target;
  const nodeEl = closestOf(t, '.node');
  const edgeEl = closestOf(t, '.edge');
  if (nodeEl) openNodeCtx(e, nodeEl.dataset.id);
  else if (edgeEl) openEdgeCtx(e, edgeEl.dataset.id);
  else openCanvasCtx(e);
});

function buildCtx(items) {
  ctxMenu.innerHTML = '';
  items.forEach(it => {
    if (!it) return;
    if (it.type === 'sep') {
      const d = document.createElement('div');
      d.className = 'ctx-sep';
      ctxMenu.appendChild(d);
      return;
    }
    if (it.type === 'header') {
      const h = document.createElement('div');
      h.className = 'ctx-header';
      h.textContent = it.label;
      ctxMenu.appendChild(h);
      return;
    }
    if (it.type === 'swatches') {
      const row = document.createElement('div');
      row.className = 'ctx-swatches' + (it.recent ? ' recent' : '');
      it.colors.forEach(c => {
        const sw = document.createElement('div');
        sw.className = 'sw';
        if (typeof c === 'object') sw.style.background = `linear-gradient(135deg, ${c.fill} 55%, ${c.stroke} 55%)`;
        else sw.style.background = c;
        sw.title = typeof c === 'object' ? `${c.fill} / ${c.stroke}` : c;
        sw.addEventListener('click', () => { it.onPick(c); hideCtxMenu(); });
        row.appendChild(sw);
      });
      ctxMenu.appendChild(row);
      return;
    }
    if (it.type === 'shapes') {
      const grid = document.createElement('div');
      grid.className = 'ctx-shapes';
      Object.entries(SHAPES).forEach(([k, v]) => {
        const el = document.createElement('div');
        el.className = 'ctx-shape';
        el.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="14">${
          shapePaths(k, 1, 1, 22, 12).map((d, i) =>
            `<path d="${d}" fill="${i === 0 && v.fill !== 'transparent' ? v.fill : 'none'}" stroke="${v.stroke}" stroke-width="1.4" stroke-linejoin="round"/>`
          ).join('')
        }</svg><span>${v.label}</span>`;
        el.addEventListener('click', () => { it.onPick(k); hideCtxMenu(); });
        grid.appendChild(el);
      });
      ctxMenu.appendChild(grid);
      return;
    }
    if (it.type === 'buttons') {
      const row = document.createElement('div');
      row.className = 'ctx-buttons';
      it.buttons.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'ctx-btn' + (b.active ? ' active' : '');
        btn.innerHTML = b.label;
        btn.title = b.title || '';
        btn.addEventListener('click', () => { b.onClick(); });
        row.appendChild(btn);
      });
      ctxMenu.appendChild(row);
      return;
    }
    const row = document.createElement('div');
    row.className = 'ctx-item' + (it.danger ? ' danger' : '') + (it.disabled ? ' disabled' : '');
    row.innerHTML = `<span class="icon">${it.icon || ''}</span><span>${it.label}</span>${
      it.kbd ? `<span class="kbd">${it.kbd}</span>` : ''}`;
    row.addEventListener('click', () => { if (it.action) it.action(); hideCtxMenu(); });
    ctxMenu.appendChild(row);
  });
  ctxMenu.classList.add('show');
  const r = ctxMenu.getBoundingClientRect();
  const px = Math.min(e.clientX, window.innerWidth - r.width - 8);
  const py = Math.min(e.clientY, window.innerHeight - r.height - 8);
  ctxMenu.style.left = Math.max(8, px) + 'px';
  ctxMenu.style.top = Math.max(8, py) + 'px';
}

function openNodeCtx(e, id) {
  if (!selected.nodes.has(id)) {
    clearSelection();
    selected.nodes.add(id);
    render();
  }
  const n = getNode(id);
  const ids = [...selected.nodes];

  /* buttons row: bold/italic + autoFit */
  const formatButtons = {
    type: 'buttons',
    buttons: [
      { label: '<b>B</b>', title: 'Đậm', active: n.bold, onClick: () => {
        ids.forEach(i => { const nn = getNode(i); if (nn) nn.bold = !nn.bold; });
        render(); pushHistory(); hideCtxMenu();
      }},
      { label: '<i>I</i>', title: 'Nghiêng', active: n.italic, onClick: () => {
        ids.forEach(i => { const nn = getNode(i); if (nn) nn.italic = !nn.italic; });
        render(); pushHistory(); hideCtxMenu();
      }},
      { label: 'AF', title: 'Auto-fit', active: n.autoFit !== false, onClick: () => {
        ids.forEach(i => { const nn = getNode(i); if (nn) nn.autoFit = !(nn.autoFit !== false); });
        render(); pushHistory(); hideCtxMenu();
      }},
      { label: 'L', title: 'Căn trái', active: n.hAlign === 'left', onClick: () => {
        ids.forEach(i => { const nn = getNode(i); if (nn) nn.hAlign = 'left'; });
        render(); pushHistory(); hideCtxMenu();
      }},
      { label: 'C', title: 'Căn giữa', active: (n.hAlign || 'center') === 'center', onClick: () => {
        ids.forEach(i => { const nn = getNode(i); if (nn) nn.hAlign = 'center'; });
        render(); pushHistory(); hideCtxMenu();
      }},
      { label: 'R', title: 'Căn phải', active: n.hAlign === 'right', onClick: () => {
        ids.forEach(i => { const nn = getNode(i); if (nn) nn.hAlign = 'right'; });
        render(); pushHistory(); hideCtxMenu();
      }},
    ]
  };

  const fontButtons = {
    type: 'buttons',
    buttons: Object.entries(FONT_PRESETS).map(([k, v]) => ({
      label: k,
      title: `${k} (${v}px)`,
      onClick: () => { applyFontPreset(ids, k); hideCtxMenu(); }
    }))
  };

  const sizeButtons = {
    type: 'buttons',
    buttons: Object.entries(SIZE_PRESETS).map(([k, v]) => ({
      label: k,
      title: `Kích thước ${k} (×${v.factor})`,
      onClick: () => { applySizePreset(ids, k); hideCtxMenu(); }
    }))
  };

  const items = [
    { icon: '✎', label: 'Sửa văn bản', kbd: 'Dbl-click', action: () => startTextEdit(n) },
    { type: 'header', label: 'Định dạng chữ' },
    formatButtons,
    { type: 'header', label: 'Cỡ chữ (relative)' },
    fontButtons,
    { type: 'sep' },
    { type: 'header', label: 'Kích thước khối' },
    sizeButtons,
    { type: 'sep' },
    { type: 'header', label: 'Đổi hình dạng' },
    { type: 'shapes', onPick: k => {
      ids.forEach(i => { const nn = getNode(i); if (nn) nn.type = k; });
      render(); pushHistory();
    }},
    { type: 'header', label: 'Màu sắc' },
    { type: 'swatches', colors: COLOR_PAIRS, onPick: c => {
      ids.forEach(i => { const nn = getNode(i); if (nn) { nn.fill = c.fill; nn.stroke = c.stroke; } });
      pushRecentColor(c.fill, c.stroke);
      render(); pushHistory();
    }},
  ];
  if (recentColors.length) {
    items.push({ type: 'header', label: 'Màu gần đây' });
    items.push({ type: 'swatches', colors: recentColors, recent: true, onPick: c => {
      ids.forEach(i => { const nn = getNode(i); if (nn) { nn.fill = c.fill; nn.stroke = c.stroke; } });
      render(); pushHistory();
    }});
  }
  items.push(
    { type: 'sep' },
    { icon: '⎘', label: 'Nhân bản', kbd: 'Ctrl+D', action: duplicateSelection },
    { icon: '⧉', label: 'Sao chép', kbd: 'Ctrl+C', action: copySelection },
    { icon: '✂', label: 'Cắt', kbd: 'Ctrl+X', action: cutSelection },
    { icon: n.locked ? '🔓' : '🔒', label: n.locked ? 'Mở khoá' : 'Khoá hình', action: () => {
      ids.forEach(i => { const nn = getNode(i); if (nn) nn.locked = !nn.locked; });
      render(); pushHistory();
    }},
    { type: 'sep' },
    { icon: '⤒', label: 'Đưa lên trên cùng', action: () => bringToFront(ids) },
    { icon: '↑', label: 'Lên một lớp', action: () => bringForward(ids) },
    { icon: '↓', label: 'Xuống một lớp', action: () => sendBackward(ids) },
    { icon: '⤓', label: 'Đưa xuống dưới cùng', action: () => sendToBack(ids) },
    { type: 'sep' },
    { icon: '✕', label: 'Xoá', kbd: 'Del', danger: true, action: deleteSelection },
  );

  if (ids.length > 1) {
    /* multi-select: simpler menu with alignment focus */
    const arr = [...selected.nodes];
    buildCtx([
      { type: 'header', label: `Đã chọn ${ids.length} hình` },
      formatButtons,
      { type: 'header', label: 'Cỡ chữ' },
      fontButtons,
      { type: 'header', label: 'Kích thước khối' },
      sizeButtons,
      { type: 'header', label: 'Màu sắc' },
      { type: 'swatches', colors: COLOR_PAIRS, onPick: c => {
        ids.forEach(i => { const nn = getNode(i); if (nn) { nn.fill = c.fill; nn.stroke = c.stroke; } });
        pushRecentColor(c.fill, c.stroke);
        render(); pushHistory();
      }},
      recentColors.length ? { type: 'header', label: 'Màu gần đây' } : null,
      recentColors.length ? { type: 'swatches', colors: recentColors, recent: true, onPick: c => {
        ids.forEach(i => { const nn = getNode(i); if (nn) { nn.fill = c.fill; nn.stroke = c.stroke; } });
        render(); pushHistory();
      }} : null,
      { type: 'sep' },
      { type: 'header', label: 'Căn chỉnh' },
      { icon: '⇤', label: 'Căn trái', action: () => alignNodes('left') },
      { icon: '↔', label: 'Căn giữa ngang', action: () => alignNodes('hcenter') },
      { icon: '⇥', label: 'Căn phải', action: () => alignNodes('right') },
      { icon: '⇡', label: 'Căn trên', action: () => alignNodes('top') },
      { icon: '↕', label: 'Căn giữa dọc', action: () => alignNodes('vcenter') },
      { icon: '⇣', label: 'Căn dưới', action: () => alignNodes('bottom') },
      { icon: '⇹', label: 'Phân bố ngang', action: () => alignNodes('distH') },
      { icon: '⇳', label: 'Phân bố dọc', action: () => alignNodes('distV') },
      { type: 'sep' },
      { icon: '⎘', label: 'Nhân bản', kbd: 'Ctrl+D', action: duplicateSelection },
      { icon: '⧉', label: 'Sao chép', kbd: 'Ctrl+C', action: copySelection },
      { icon: '✂', label: 'Cắt', kbd: 'Ctrl+X', action: cutSelection },
      { icon: '🔒', label: 'Khoá / Mở khoá', action: () => {
        const anyUnlocked = ids.some(i => { const nn = getNode(i); return nn && !nn.locked; });
        ids.forEach(i => { const nn = getNode(i); if (nn) nn.locked = anyUnlocked; });
        render(); pushHistory();
      }},
      { type: 'sep' },
      { icon: '⤒', label: 'Đưa lên trên cùng', action: () => bringToFront(ids) },
      { icon: '⤓', label: 'Đưa xuống dưới cùng', action: () => sendToBack(ids) },
      { type: 'sep' },
      { icon: '⌖', label: 'Zoom tới vùng chọn', action: () => zoomToSelection() },
      { type: 'sep' },
      { icon: '✕', label: 'Xoá tất cả', kbd: 'Del', danger: true, action: deleteSelection },
    ]);
    return;
  }
  buildCtx(items);
}

function openEdgeCtx(e, id) {
  if (!selected.edges.has(id)) {
    clearSelection();
    selected.edges.add(id);
    render();
  }
  const ed = getEdge(id);
  const routing = ed.routing || 'curve';
  buildCtx([
    { icon: '🏷', label: ed.label ? 'Sửa nhãn' : 'Thêm nhãn', action: () => {
      const v = prompt('Nhãn cho đường nối:', ed.label || '');
      if (v !== null) { ed.label = v; render(); pushHistory(); }
    }},
    { type: 'sep' },
    { type: 'header', label: 'Định tuyến' },
    { type: 'buttons', buttons: [
      { label: '〜 Cong', active: routing === 'curve', onClick: () => { ed.routing = 'curve'; render(); pushHistory(); hideCtxMenu(); }},
      { label: '╱ Thẳng', active: routing === 'straight', onClick: () => { ed.routing = 'straight'; render(); pushHistory(); hideCtxMenu(); }},
      { label: '⌐ Gấp', active: routing === 'orthogonal', onClick: () => { ed.routing = 'orthogonal'; render(); pushHistory(); hideCtxMenu(); }},
    ]},
    { type: 'sep' },
    { type: 'header', label: 'Mũi tên' },
    { type: 'buttons', buttons: [
      { label: '→', title: 'Đầu cuối', active: ed.arrowEnd !== false && !ed.arrowStart, onClick: () => {
        ed.arrowEnd = true; ed.arrowStart = false; render(); pushHistory(); hideCtxMenu();
      }},
      { label: '←', title: 'Đầu đầu', active: !ed.arrowEnd && ed.arrowStart, onClick: () => {
        ed.arrowEnd = false; ed.arrowStart = true; render(); pushHistory(); hideCtxMenu();
      }},
      { label: '↔', title: 'Cả hai', active: ed.arrowEnd !== false && ed.arrowStart, onClick: () => {
        ed.arrowEnd = true; ed.arrowStart = true; render(); pushHistory(); hideCtxMenu();
      }},
      { label: '—', title: 'Không', active: !ed.arrowEnd && !ed.arrowStart, onClick: () => {

function openCanvasCtx(e) {

/* ==================================================================
   KEYBOARD
   ================================================================== */
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
  const ctrl = e.ctrlKey || e.metaKey;
  const shift = e.shiftKey;

  if (ctrl && e.key.toLowerCase() === 'z' && !shift) { e.preventDefault(); undo(); return; }
  if (ctrl && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && shift))) { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (ctrl && e.key.toLowerCase() === 'a') { e.preventDefault(); selectAll(); return; }
  if (ctrl && e.key.toLowerCase() === 'c') { e.preventDefault(); copySelection(); return; }
  if (ctrl && e.key.toLowerCase() === 'x') { e.preventDefault(); cutSelection(); return; }
  if (ctrl && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteClipboard(); return; }
  if (ctrl && e.key.toLowerCase() === 'f') { e.preventDefault(); openSearch(); return; }
  if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); saveJSON(); return; }
  if (ctrl && e.key === '0') { e.preventDefault(); if (shift) zoomToSelection(); else fitView(); return; }
  if (ctrl && e.key === '=') { e.preventDefault(); zoomBy(1.2); return; }
  if (ctrl && e.key === '-') { e.preventDefault(); zoomBy(1 / 1.2); return; }

  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.key === 'Escape') { closeSearch(); clearSelection(); hideCtxMenu(); render(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }

  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && selected.nodes.size) {
    e.preventDefault();
    const step = e.shiftKey ? 1 : (snapToGrid ? GRID : 10);
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    selected.nodes.forEach(id => {
      const n = getNode(id);
      if (n && !n.locked) { n.x += dx; n.y += dy; }
    });
    render(true);
    clearTimeout(window.__nudgeTimer);
    window.__nudgeTimer = setTimeout(pushHistory, 400);
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

let indicatorTimer = null;
function flashIndicator(text) {
  modeIndicator.textContent = text;
  modeIndicator.classList.add('show');
  clearTimeout(indicatorTimer);
  indicatorTimer = setTimeout(() => modeIndicator.classList.remove('show'), 1400);
}

/* ==================================================================
   SEARCH
   ================================================================== */
function openSearch() {
  searchPanel.classList.add('show');
  searchInput.value = '';
  renderSearchResults('');
  setTimeout(() => searchInput.focus(), 30);
}
function closeSearch() { searchPanel.classList.remove('show'); }
function renderSearchResults(q) {
  q = q.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (!q) {
    searchResults.innerHTML = `<div class="search-empty">Nhập nội dung để tìm trong ${nodes.length} hình</div>`;
    return;
  }
  const matches = nodes.filter(n => (n.text || '').toLowerCase().includes(q));
  if (!matches.length) {
    searchResults.innerHTML = `<div class="search-empty">Không tìm thấy hình nào</div>`;
    return;
  }
  matches.slice(0, 30).forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-result';
    const label = n.text || `(${SHAPES[n.type]?.label || n.type})`;
    el.innerHTML = `<span class="dot" style="background:${n.fill === 'transparent' ? '#e3e7f0' : n.fill};border:1px solid ${n.stroke}"></span>
      <span>${esc(label.slice(0, 60))}</span>
      <span class="meta">${SHAPES[n.type]?.label || n.type}</span>`;
    el.addEventListener('click', () => {
      clearSelection();
      selected.nodes.add(n.id);
      centerOnNode(n);
      render();
      closeSearch();
    });
    searchResults.appendChild(el);
  });
}
function centerOnNode(n) {
  const cw = canvasWrap.clientWidth, chh = canvasWrap.clientHeight;
  view.x = cw / 2 - (n.x + n.w / 2) * view.k;
  view.y = chh / 2 - (n.y + n.h / 2) * view.k;
}
searchInput.addEventListener('input', e => renderSearchResults(e.target.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if (e.key === 'Enter') {
    const first = searchResults.querySelector('.search-result');
    if (first) first.click();
  }
});

function updateInspector() {
  const nodeSel = [...selected.nodes].map(getNode).filter(Boolean);
  const edgeSel = [...selected.edges].map(getEdge).filter(Boolean);
  if (nodeSel.length === 1) renderNodeInspector(nodeSel[0]);
  else if (edgeSel.length === 1) renderEdgeInspector(edgeSel[0]);
  else if (nodeSel.length > 1) renderMultiInspector(nodeSel);
  else inspector.innerHTML = `
    <div class="empty-state">
      <span class="big">◈</span>
      Chọn một hình hoặc đường nối<br>để chỉnh sửa thuộc tính.<br><br>

        Text tự động co vừa khung

}

    <div class="align-grid" style="grid-template-columns:repeat(5,1fr)">
      ${Object.entries(SIZE_PRESETS).map(([k]) =>
        `<div class="align-btn" data-size="${k}" style="font-size:11px;font-weight:600">${k}</div>`).join('')}
    </div>
    <div class="insp-title">Màu sắc</div>
    <div class="swatch-row" id="m-swatches">
      ${COLOR_PAIRS.map(c => `<div class="swatch" data-fill="${c.fill}" data-stroke="${c.stroke}"
        style="background:linear-gradient(135deg, ${c.fill} 55%, ${c.stroke} 55%)"></div>`).join('')}
    </div>
    <div class="insp-title">Hành động</div>
    <button style="width:100%;justify-content:center;margin-bottom:6px" id="m-lock">🔒 Khoá / Mở khoá</button>
    <button style="width:100%;justify-content:center" id="m-dup">Nhân bản (Ctrl+D)</button>
    <button class="danger" id="m-del">Xoá tất cả (Del)</button>
  `;
  const g = id => document.getElementById(id);
  g('a-left').onclick = () => alignNodes('left');
  g('a-hc').onclick = () => alignNodes('hcenter');
  g('a-right').onclick = () => alignNodes('right');
  g('a-top').onclick = () => alignNodes('top');
  g('a-vc').onclick = () => alignNodes('vcenter');
  g('a-bottom').onclick = () => alignNodes('bottom');
  g('a-dh').onclick = () => alignNodes('distH');
  g('a-dv').onclick = () => alignNodes('distV');
  document.querySelectorAll('[data-size]').forEach(b => {
    b.onclick = () => applySizePreset(sel.map(n => n.id), b.dataset.size);
  });
  g('m-lock').onclick = () => {
    const anyUnlocked = sel.some(n => !n.locked);
    sel.forEach(n => n.locked = anyUnlocked);
    render(); pushHistory();
  };
  g('m-dup').onclick = duplicateSelection;
  g('m-del').onclick = deleteSelection;
  document.querySelectorAll('#m-swatches .swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      sel.forEach(n => { n.fill = sw.dataset.fill; n.stroke = sw.dataset.stroke; });
      pushRecentColor(sw.dataset.fill, sw.dataset.stroke);
      render(); pushHistory();
    });
  });
}
