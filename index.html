/* ==================================================================
   PALETTE
   ================================================================== */
function paletteIcon(type) {
  const w = 42, h = 28;
  const sh = SHAPES[type];
  const paths = shapePaths(type, 3, 3, w - 6, h - 6);
  const fill0 = sh.fill === 'transparent' ? 'none' : sh.fill;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    ${paths.map((d, i) => `<path d="${d}" fill="${i === 0 ? fill0 : 'none'}" stroke="${sh.stroke}"
      stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
  </svg>`;
}
function buildPalette() {
  paletteEl.innerHTML = '';
  GROUP_ORDER.forEach(gr => {
    const shapes = Object.entries(SHAPES).filter(([, v]) => v.group === gr);
    const group = document.createElement('div');
    group.className = 'pal-group';
    group.innerHTML = `
      <div class="pal-group-header">
        <span>${gr}</span>
        <span class="chev">▾</span>
      </div>
      <div class="pal-group-items"></div>
    `;
    const items = group.querySelector('.pal-group-items');
    shapes.forEach(([k, v]) => {
      const el = document.createElement('div');
      el.className = 'pal-item';
      el.title = `Thêm ${v.label}`;
      el.innerHTML = paletteIcon(k) + `<span>${v.label}</span>`;
      el.addEventListener('click', () => {
        const c = centerWorld();
        const n = addNode(k, c.x, c.y);
        clearSelection();
        selected.nodes.add(n.id);
        render(); pushHistory();
      });
      items.appendChild(el);
    });
    const header = group.querySelector('.pal-group-header');
    header.addEventListener('click', () => group.classList.toggle('collapsed'));
    paletteEl.appendChild(group);
  });
  const hintBox = document.createElement('div');
  hintBox.innerHTML = `<div style="font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:16px 0 9px;">Điều khiển</div>
    <ul class="hints">
      <li><b>Kéo chuột trái</b> vùng trống → pan</li>
      <li><b>Shift + kéo</b> → chọn vùng</li>
      <li><b>Chuột phải</b> → menu đầy đủ</li>
      <li><b>Alt + kéo</b> hình → nhân bản</li>
      <li>Kéo hình gần nhau → hút thẳng hàng</li>
      <li><b>Ctrl+F</b> tìm · <b>?</b> trợ giúp</li>
    </ul>`;
  paletteEl.appendChild(hintBox);
}

/* ==================================================================
   EXPORT / IMPORT
   ================================================================== */
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function contentBounds() {
  if (!nodes.length) return { x: 0, y: 0, w: 900, h: 640 };
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  });
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}
function buildExportSVG() {
  const pad = 44;
  const b = contentBounds();
  const W = b.w + pad * 2, H = b.h + pad * 2;
  const cloneEdges = edgesLayer.cloneNode(true);
  const cloneNodes = nodesLayer.cloneNode(true);
  [cloneEdges, cloneNodes].forEach(layer => {
    layer.querySelectorAll('.port,.handle,.sel-outline,.target-highlight,.lock-badge').forEach(el => el.remove());
    layer.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
  });
  const out = svgEl('svg', { xmlns: NS, width: W, height: H, viewBox: `${b.x - pad} ${b.y - pad} ${W} ${H}` });
  out.appendChild(svgEl('rect', { x: b.x - pad, y: b.y - pad, width: W, height: H, fill: '#ffffff' }));
  out.appendChild(defs.cloneNode(true));
  const g = svgEl('g');
  g.appendChild(cloneEdges);
  g.appendChild(cloneNodes);
  out.appendChild(g);
  return { svg: out, W, H };
}
function exportSVGFile() {
  if (!nodes.length) return alert('Chưa có nội dung để xuất.');
  const { svg: s } = buildExportSVG();
  const str = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(s);
  downloadBlob(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }), 'fwrt-flowchart.svg');
}
function exportPNG() {
  if (!nodes.length) return alert('Chưa có nội dung để xuất.');
  const { svg: s, W, H } = buildExportSVG();
  const str = new XMLSerializer().serializeToString(s);
  const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.round(W * scale);
    c.height = Math.round(H * scale);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(blob => downloadBlob(blob, 'fwrt-flowchart.png'), 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('Không thể xuất PNG.'); };
  img.src = url;
}
function saveJSON() {
  const data = {
    app: 'Fwrt', version: 5,
    savedAt: new Date().toISOString(),
    view, nodes, edges
  };
  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'fwrt-flowchart.json');
}
function openJSON(text) {
  try {
    const d = JSON.parse(text);
    if (!d.nodes || !Array.isArray(d.nodes)) throw new Error('Định dạng không hợp lệ');
    nodes = d.nodes;
    edges = d.edges || [];
    if (d.view) { view.x = d.view.x || 0; view.y = d.view.y || 0; view.k = d.view.k || 1; }
    clearSelection();
    const keyMap = {
      terminator: 'oval', process: 'rect', decision: 'diamond', io: 'parallelogram',
      preparation: 'hexagon', manual: 'trapezoid', connector: 'circle', database: 'cylinder'
    };
    nodes.forEach(n => {
      if (keyMap[n.type]) n.type = keyMap[n.type];
      n.fill = n.fill || '#dbeafe';
      n.stroke = n.stroke || '#2563eb';
      n.textColor = n.textColor || '#1e2433';
      n.fontSize = n.fontSize || 14;
      n.strokeWidth = n.strokeWidth ?? 2;
      if (n.bold === undefined) n.bold = false;
      if (n.italic === undefined) n.italic = false;
      if (n.autoFit === undefined) n.autoFit = true;
      if (!n.hAlign) n.hAlign = 'center';
      if (!n.vAlign) n.vAlign = 'middle';
      if (n.locked === undefined) n.locked = false;
    });
    edges.forEach(e => {
      e.color = e.color || '#7c869e';
      e.width = e.width || 2;
      e.fromSide = e.fromSide || 'auto';
      e.toSide = e.toSide || 'auto';
      if (e.arrowEnd === undefined) e.arrowEnd = true;
      if (e.arrowStart === undefined) e.arrowStart = false;
      if (!e.routing) e.routing = 'curve';
    });
    history = []; hIndex = -1;
    render(); pushHistory();
    setTimeout(fitView, 60);
    flashIndicator('Đã mở lưu đồ');
  } catch (err) {
    alert('Lỗi khi mở file: ' + err.message);
  }
}

let autoSaveTimer = null;
function autoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    try { localStorage.setItem('fwrt-flowchart-v5', JSON.stringify({ nodes, edges, view })); } catch (_) {}
  }, 500);
}
function loadAutoSave() {
  try {
    const raw = localStorage.getItem('fwrt-flowchart-v5') ||
                localStorage.getItem('fwrt-flowchart-v4') ||
                localStorage.getItem('fwrt-flowchart');
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.nodes) return false;
    nodes = d.nodes; edges = d.edges || [];
    if (d.view) { view.x = d.view.x || 0; view.y = d.view.y || 0; view.k = d.view.k || 1; }
    const keyMap = {
      terminator: 'oval', process: 'rect', decision: 'diamond', io: 'parallelogram',
      preparation: 'hexagon', manual: 'trapezoid', connector: 'circle', database: 'cylinder'
    };
    nodes.forEach(n => {
      if (keyMap[n.type]) n.type = keyMap[n.type];
      if (!n.fill) n.fill = '#dbeafe';
      if (!n.stroke) n.stroke = '#2563eb';
      if (!n.textColor) n.textColor = '#1e2433';
      if (!n.fontSize) n.fontSize = 14;
      if (n.strokeWidth == null) n.strokeWidth = 2;
      if (n.bold === undefined) n.bold = false;
      if (n.italic === undefined) n.italic = false;
      if (n.autoFit === undefined) n.autoFit = true;
      if (!n.hAlign) n.hAlign = 'center';
      if (!n.vAlign) n.vAlign = 'middle';
      if (n.locked === undefined) n.locked = false;
    });
    edges.forEach(e => {
      if (!e.color) e.color = '#7c869e';
      if (!e.width) e.width = 2;
      if (!e.fromSide) e.fromSide = 'auto';
      if (!e.toSide) e.toSide = 'auto';
      if (e.arrowEnd === undefined) e.arrowEnd = true;
      if (e.arrowStart === undefined) e.arrowStart = false;
      if (!e.routing) e.routing = 'curve';
    });
    return true;
  } catch (_) { return false; }
}

/* ==================================================================
   VIEW
   ================================================================== */
function fitView() {
  if (!nodes.length) {
    view.x = canvasWrap.clientWidth / 2;
    view.y = canvasWrap.clientHeight / 2;
    view.k = 1;
    render();
    return;
  }
  const pad = 70;
  const b = contentBounds();
  const cw = canvasWrap.clientWidth, chh = canvasWrap.clientHeight;
  const k = clamp(Math.min((cw - pad * 2) / b.w, (chh - pad * 2) / b.h), 0.12, 2.2);
  view.k = k;
  view.x = cw / 2 - (b.x + b.w / 2) * k;
  view.y = chh / 2 - (b.y + b.h / 2) * k;
  render();
}
function zoomToSelection() {
  const sel = [...selected.nodes].map(getNode).filter(Boolean);
  if (!sel.length) return fitView();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  sel.forEach(n => {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  });
  const b = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  const pad = 90;
  const cw = canvasWrap.clientWidth, chh = canvasWrap.clientHeight;
  const k = clamp(Math.min((cw - pad * 2) / b.w, (chh - pad * 2) / b.h), 0.12, 4);
  view.k = k;
  view.x = cw / 2 - (b.x + b.w / 2) * k;
  view.y = chh / 2 - (b.y + b.h / 2) * k;
  render();
  flashIndicator('Zoom tới vùng chọn');
}
function zoomBy(factor) {
  const cw = canvasWrap.clientWidth / 2, chh = canvasWrap.clientHeight / 2;
  const oldK = view.k;
  const k = clamp(oldK * factor, 0.12, 4);
  view.x = cw - (cw - view.x) * (k / oldK);
  view.y = chh - (chh - view.y) * (k / oldK);
  view.k = k;
  render(true);
}

/* ==================================================================
   BUTTONS
   ================================================================== */
document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnRedo').onclick = redo;
document.getElementById('btnZoomIn').onclick = () => zoomBy(1.2);
document.getElementById('btnZoomOut').onclick = () => zoomBy(1 / 1.2);
document.getElementById('btnFit').onclick = () => fitView();
document.getElementById('btnSave').onclick = saveJSON;
document.getElementById('btnSvg').onclick = exportSVGFile;
document.getElementById('btnPng').onclick = exportPNG;
document.getElementById('btnOpen').onclick = () => fileInput.click();
document.getElementById('btnSearch').onclick = openSearch;
document.getElementById('btnNew').onclick = () => {
  if (nodes.length && !confirm('Tạo lưu đồ mới? Nội dung hiện tại sẽ bị xoá.')) return;
  nodes = []; edges = [];
  clearSelection();
  view.x = canvasWrap.clientWidth / 2;
  view.y = canvasWrap.clientHeight / 2;
  view.k = 1;
  history = []; hIndex = -1;
  render(); pushHistory();
  localStorage.removeItem('fwrt-flowchart-v5');
  localStorage.removeItem('fwrt-flowchart-v4');
  localStorage.removeItem('fwrt-flowchart');
};
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => openJSON(reader.result);
  reader.readAsText(f);
  fileInput.value = '';
});
chkGrid.addEventListener('change', () => updateGrid());
chkSnap.addEventListener('change', () => { snapToGrid = chkSnap.checked; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => openJSON(reader.result);
  reader.readAsText(f);
});

/* ==================================================================
   INIT
   ================================================================== */
function init() {
  buildPalette();
  const loaded = loadAutoSave();
  if (!loaded) {
    view.x = canvasWrap.clientWidth / 2;
    view.y = canvasWrap.clientHeight / 2;
    view.k = 1;
  }
  render();
  pushHistory();
  updateUndoButtons();
  window.addEventListener('resize', () => drawMinimap());
  window.addEventListener('beforeunload', () => { if (nodes.length) autoSave(); });
}
init();
</script>
