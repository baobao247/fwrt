<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fwrt — Trình vẽ lưu đồ chuyên nghiệp</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="errorBanner"></div>
<div id="app">
<header class="topbar">
<a href="../in4/index.html" class="hub-btn" title="Về trang cá nhân (in4)" style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;margin-right:10px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--border);color:var(--accent);font-weight:700;font-size:0.8rem;text-decoration:none;cursor:pointer;">← in4</a>
<div class="brand">
<div class="logo">Fw</div>
<div class="name"><b>Fwrt</b><small>FLOWCHART EDITOR v2</small></div>
</div>
<div class="tools">
<button class="icon" id="btnTogglePalette" title="Ẩn/Hiện bảng hình (Ctrl+B)" aria-label="Ẩn/Hiện bảng hình">◀</button>
<span class="divider"></span>
<button class="icon" id="btnUndo" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác">↶</button>
<button class="icon" id="btnRedo" title="Làm lại (Ctrl+Y)" aria-label="Làm lại">↷</button>
<button class="icon" id="btnSearch" title="Tìm kiếm & Thay thế (Ctrl+F)" aria-label="Tìm kiếm">🔍</button>
<button class="icon" id="btnMetrics" title="Thống kê & Độ phức tạp McCabe (Alt+M)" aria-label="Thống kê lưu đồ">📊</button>
<button class="icon" id="btnWatermark" title="Đóng dấu bản quyền / Watermark" aria-label="Đóng dấu bản quyền">💧</button>
<button class="icon" id="btnCmd" title="Command Palette (Ctrl+K)" aria-label="Command Palette">⌘</button>
<button class="icon" id="btnHelp" title="Trợ giúp (?)" aria-label="Trợ giúp">?</button>
<button class="icon" id="btnAbout" title="Giới thiệu" aria-label="Giới thiệu">ℹ</button>
<button class="icon" id="btnBackup" title="Sao lưu / Khôi phục" aria-label="Sao lưu / Khôi phục">💾</button>
<span class="divider"></span>
<button class="icon" id="btnZoomOut" title="Thu nhỏ" aria-label="Thu nhỏ">−</button>
<span id="zoomLabel">100%</span>
<button class="icon" id="btnZoomIn" title="Phóng to" aria-label="Phóng to">+</button>
<button id="btnFit" title="Vừa khung (Ctrl+0)">Vừa khung</button>
<span class="divider"></span>
<label class="chk"><input type="checkbox" id="chkGrid" checked> Lưới</label>
<label class="chk"><input type="checkbox" id="chkSnap"> Bám</label>
<label class="chk"><input type="checkbox" id="chkSplitPorts" checked onchange="render(true)" title="Mặc định chung cho mọi đường nối — có thể ghi đè riêng từng đường trong bảng thuộc tính"> Tách mũi</label>
<label class="chk"><input type="checkbox" id="chkGuides" checked title="Hiện đường gióng thông minh khi kéo/resize hình"> Guides</label>
<span class="divider"></span>
<button id="btnNew" title="Tạo mới">Mới</button>
<button id="btnOpen" title="Mở file .json">Mở</button>
<button id="btnSave" title="Lưu file .json (Ctrl+S)">Lưu</button>
<button id="btnExport" title="Xuất file">⤓ Xuất</button>
<button id="btnPng" class="primary" title="Xuất ảnh PNG nhanh">⤓ PNG</button>
</div>
</header>
<div class="tabsbar">
<div class="tabs-wrap">
<button class="tab-scroll-btn" id="tabScrollLeft" title="Cuộn trái" aria-label="Cuộn tab sang trái">‹</button>
<div class="tabs" id="tabsList"></div>
<button class="tab-scroll-btn" id="tabScrollRight" title="Cuộn phải" aria-label="Cuộn tab sang phải">›</button>
</div>
<button class="tab-add" id="btnAddPage" title="Thêm trang (Ctrl+T)" aria-label="Thêm trang mới">+</button>
<button class="tab-dropdown-btn" id="tabDropdownBtn" title="Danh sách tab" aria-label="Danh sách tab">▾</button>
<div style="flex:1"></div>
<div class="tab-actions">
<button id="btnTemplates" title="Chèn mẫu">📋 Mẫu</button>
<button id="btnAutoLayout" title="Sắp xếp tự động">⚡ Sắp xếp</button>
<button class="icon" id="btnTheme" title="Chế độ tối" aria-label="Chuyển chế độ sáng/tối">🌙</button>
<button class="icon" id="btnFullscreen" title="Toàn màn hình (F11)" aria-label="Toàn màn hình">⛶</button>
</div>
</div>
<div class="tab-dropdown" id="tabDropdown"></div>
<div class="body">
<aside class="palette" id="palette"></aside>
<main class="canvas-wrap" id="canvasWrap">
<svg id="svg">
<defs id="defs"></defs>
<g id="viewport">
<g id="groupsLayer"></g>
<g id="edgesLayer"></g>
<g id="nodesLayer"></g>
<g id="overlayLayer"></g>
</g>
</svg>
<div class="mode-indicator" id="modeIndicator"></div>
<div class="perf-badge" id="perfBadge"></div>
<div class="zoombar">
<span>Zoom: <b id="zoomLabel2">100%</b></span>
<span>·</span>
<span>Hình: <b id="statNodes">0</b></span>
<span>·</span>
<span>Nối: <b id="statEdges">0</b></span>
</div>
<div class="minimap" id="minimap">
<svg id="minimapSvg"></svg>
<div class="minimap-tools">
<button id="mmFit" title="Vừa khung" aria-label="Vừa khung minimap">⛶</button>
<button id="mmCenter" title="Căn giữa canvas" aria-label="Căn giữa canvas">⌖</button>
</div>
</div>
<div class="search-panel" id="searchPanel">
<input type="text" id="searchInput" placeholder="Tìm… (text, tag:xxx, type:xxx, color:#xxx)">
<div class="search-hint">Ví dụ: <code>tag:api type:diamond</code> · <code>color:#dbeafe</code></div>
<div class="search-replace-row">
<input type="text" id="replaceInput" placeholder="Thay thế bằng…">
<button id="btnReplaceNext" title="Thay thế từ khóa kế tiếp">Thay thế</button>
<button id="btnReplaceAll" title="Thay thế toàn bộ sơ đồ">Tất cả</button>
</div>
<div class="search-results" id="searchResults"></div>
</div>
</main>
<aside class="inspector" id="inspector"></aside>
</div>
</div>
<div class="modal-bg" id="helpModal">
<div class="modal">
<div class="modal-header"><h2>Phím tắt & Hướng dẫn</h2><button class="modal-close" id="helpClose" aria-label="Đóng">✕</button></div>
<div class="modal-body" id="helpBody"></div>
</div>
</div>
<div class="modal-bg" id="dlgModal">
<div class="modal" style="max-width:440px">
<div class="modal-header">
<h2 id="dlgTitle">Thông báo</h2>
<button class="modal-close" id="dlgClose" aria-label="Đóng">✕</button>
</div>
<div class="modal-body">
<div class="modal-msg" id="dlgMessage"></div>
<input type="text" class="modal-input" id="dlgInput" style="display:none">
</div>
<div class="modal-footer">
<button id="dlgCancel">Huỷ</button>
<button id="dlgOk" class="primary">OK</button>
</div>
</div>
</div>
<div class="modal-bg" id="aboutModal">
<div class="modal">
<div class="modal-header">
<h2>ℹ️ Giới thiệu Fwrt</h2>
<button class="modal-close" id="aboutClose" aria-label="Đóng">✕</button>
</div>
<div class="modal-body" id="aboutBody"></div>
</div>
</div>
<div class="modal-bg" id="backupModal">
<div class="modal">
<div class="modal-header">
<h2>💾 Sao lưu &amp; Khôi phục</h2>
<button class="modal-close" id="backupClose" aria-label="Đóng">✕</button>
</div>
<div class="modal-body" id="backupBody"></div>
</div>
</div>
<div class="cmd-overlay" id="cmdOverlay">
<div class="cmd-palette">
<input type="text" class="cmd-input" id="cmdInput" placeholder="Gõ lệnh… (Ctrl+K)">
<div class="cmd-list" id="cmdList"></div>
</div>
</div>
<div class="toast" id="toast"><span class="toast-icon"></span><span class="toast-text"></span></div>
<div class="ctx-menu" id="ctxMenu"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<!-- SCRIPTS: Clean Modular Architecture -->
<script src="js/constants-shapes.js"></script>
<script src="js/canvas-engine.js"></script>
<script src="js/templates.js"></script>
<script src="js/diagram-analyzer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
