<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fwrt — Trình vẽ lưu đồ</title>
<style>
  :root{
    --bg:#eef1f7; --panel:#ffffff; --border:#e3e7f0; --text:#1e2433;
    --muted:#7c869e; --accent:#4f46e5; --accent-soft:#eef0ff;
    --danger:#e11d48; --success:#16a34a; --warning:#d97706;
    --guide:#ec4899; --hover:#f6f7fb; --subtle:#fafbfe;
    --shadow:0 1px 3px rgba(20,30,60,.08), 0 8px 24px rgba(20,30,60,.06);
    --grid-dot:#d8ddea;
  }
  body.dark{
    --bg:#0d1117; --panel:#161b27; --border:#242b3d; --text:#e6e9f2;
    --muted:#8892a8; --accent:#7c7cf8; --accent-soft:#232945;
    --danger:#f87171; --success:#34d399; --warning:#fbbf24;
    --guide:#f472b6; --hover:#1f2738; --subtle:#131827;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --grid-dot:#2a3145;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;transition:background .2s,color .2s;}
  #app{display:flex;flex-direction:column;height:100vh;}
  .topbar{height:52px;flex:0 0 52px;background:var(--panel);border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:12px;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#ec4899 100%);
    color:#fff;font-weight:800;font-size:13px;letter-spacing:-.5px;
    box-shadow:0 4px 12px rgba(99,102,241,.35);}
  .brand .name{display:flex;flex-direction:column;line-height:1.05;}
  .brand .name b{font-size:15px;letter-spacing:-.3px;font-weight:800;}
  .brand .name small{font-size:9.5px;color:var(--muted);letter-spacing:.5px;font-weight:500;}
  .tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  .divider{width:1px;height:20px;background:var(--border);margin:0 3px;}
  button{font-family:inherit;font-size:12.5px;font-weight:500;background:var(--panel);color:var(--text);
    border:1px solid var(--border);padding:6px 10px;border-radius:8px;cursor:pointer;
    transition:all .13s ease;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  button:hover{background:var(--hover);border-color:#cfd6e6;}
  body.dark button:hover{border-color:#3a4257;}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 3px 10px rgba(79,70,229,.28);}
  button.primary:hover{background:#4338ca;border-color:#4338ca;}
  button.icon{padding:6px 8px;font-size:14px;line-height:1;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.danger{background:#fff1f4;border-color:#fecdd6;color:var(--danger);width:100%;
    justify-content:center;margin-top:6px;}
  body.dark button.danger{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);}
  button.danger:hover{background:#ffe4ea;}
  body.dark button.danger:hover{background:rgba(248,113,113,.2);}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;
    user-select:none;padding:0 3px;}
  .chk input{accent-color:var(--accent);cursor:pointer;}
  #zoomLabel{font-size:12px;color:var(--muted);min-width:42px;text-align:center;font-variant-numeric:tabular-nums;}

  /* ================================================================
     TABS BAR — Browser-style with scroll buttons + dropdown
     ================================================================ */
  .tabsbar{height:40px;flex:0 0 40px;background:var(--panel);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:6px;padding:0 8px;overflow:hidden;}

  /* Nút scroll (◀ ▶) */
  .tab-scroll-btn{
    width:24px;height:26px;flex:0 0 24px;padding:0;justify-content:center;
    border-radius:6px;color:var(--muted);background:transparent;border:none;
    transition:all .13s;display:none;
  }
  .tab-scroll-btn:hover{background:var(--hover);color:var(--text);}
  .tab-scroll-btn.visible{display:inline-flex;}
  .tab-scroll-btn:disabled{opacity:.3;cursor:not-allowed;}

  /* Wrapper cho tabs + scroll buttons */
  .tabs-wrap{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden;}

  /* Vùng chứa các tab — cuộn ngang */
  .tabs{
    display:flex;gap:3px;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;flex:1;min-width:0;padding:4px 0;
    scroll-behavior:smooth;
    scrollbar-color:transparent transparent;
    -ms-overflow-style:none;
    cursor:default;
  }
  .tabs::-webkit-scrollbar{display:none;width:0;height:0;}
  .tabs.dragging{cursor:grabbing;scroll-behavior:auto;}

  /* Tab — co giãn thông minh */
  .tab{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 6px 4px 11px;border-radius:8px;
    cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap;
    border:1px solid transparent;transition:all .13s;user-select:none;
    max-width:200px;min-width:60px;flex:0 1 auto;
    position:relative;
  }
  .tab:hover{background:var(--hover);color:var(--text);}
  .tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600;}
  .tab.dragging{opacity:.4;}
  .tab.drag-over{border-color:var(--accent);background:var(--accent-soft);}
  .tab .tab-name{overflow:hidden;text-overflow:ellipsis;max-width:130px;flex:1;min-width:0;}
  .tab .tab-close{
    font-size:14px;opacity:.55;padding:3px 6px;border-radius:5px;line-height:1;
    cursor:pointer;font-weight:400;display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;min-height:18px;transition:all .12s;user-select:none;flex:0 0 auto;
  }
  .tab .tab-close:hover{opacity:1;background:rgba(225,29,72,.15);color:var(--danger);}
  body.dark .tab .tab-close:hover{background:rgba(248,113,113,.2);}

  /* Nút thêm tab mới */
  .tab-add{width:26px;height:26px;padding:0;justify-content:center;font-size:16px;border-radius:7px;
    color:var(--muted);flex:0 0 26px;margin-left:2px;}

  /* Nút dropdown hiện tất cả tab */
  .tab-dropdown-btn{
    width:26px;height:26px;flex:0 0 26px;padding:0;justify-content:center;font-size:11px;
    border-radius:7px;color:var(--muted);margin-left:2px;
  }
  .tab-dropdown-btn.visible{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  /* Dropdown list all tabs */
  .tab-dropdown{
    position:fixed;z-index:1500;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 20px 60px rgba(20,30,60,.25), 0 4px 12px rgba(20,30,60,.12);
    min-width:260px;max-width:340px;max-height:60vh;overflow-y:auto;
    padding:6px;font-size:12.5px;
    display:none;
    animation:dropdownIn .16s cubic-bezier(.2,.8,.4,1);
  }
  @keyframes dropdownIn{from{opacity:0;transform:translateY(-6px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .tab-dropdown.show{display:block;}
  .tab-dropdown-header{
    padding:8px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.8px;
    text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;
  }
  .tab-dropdown-header .count{font-weight:500;opacity:.7;text-transform:none;letter-spacing:0;}
  .tab-dropdown-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:8px;cursor:pointer;
    color:var(--text);user-select:none;transition:background .1s;
    position:relative;
  }
  .tab-dropdown-item:hover{background:var(--accent-soft);color:var(--accent);}
  .tab-dropdown-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .tab-dropdown-item .num{
    font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;
    min-width:20px;text-align:center;opacity:.7;
  }
  .tab-dropdown-item.active .num{color:var(--accent);}
  .tab-dropdown-item .name{
    flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .tab-dropdown-item .close{
    font-size:14px;opacity:.4;padding:2px 5px;border-radius:4px;line-height:1;
    cursor:pointer;transition:all .12s;flex:0 0 auto;
  }
  .tab-dropdown-item .close:hover{opacity:1;background:rgba(225,29,72,.15);color:var(--danger);}
  body.dark .tab-dropdown-item .close:hover{background:rgba(248,113,113,.2);}
  .tab-dropdown-sep{height:1px;background:var(--border);margin:4px 4px;}
  .tab-dropdown-empty{padding:20px;text-align:center;color:var(--muted);font-size:12px;}

  .tab-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}

  .body{display:flex;flex:1;min-height:0;}
  .palette{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--border);
    overflow-y:auto;overflow-x:hidden;padding:10px 10px 14px;
    transition:width .25s cubic-bezier(.2,.8,.4,1), flex-basis .25s cubic-bezier(.2,.8,.4,1), padding .25s, border-width .25s;
  }
  body.palette-hidden .palette{
    width:0;flex:0 0 0;padding:0;border-right:none;overflow:hidden;
  }
  .pal-group{margin-bottom:8px;border-radius:10px;border:1px solid var(--border);overflow:hidden;background:var(--panel);}
  .pal-group-header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;
    cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    color:var(--muted);background:var(--subtle);user-select:none;transition:background .12s;}
  .pal-group-header:hover{background:var(--hover);color:var(--accent);}
  .pal-group-header .chev{transition:transform .18s;font-size:10px;opacity:.7;}
  .pal-group.collapsed .pal-group-header .chev{transform:rotate(-90deg);}
  .pal-group.collapsed .pal-group-items{display:none;}
  .pal-group-items{display:grid;grid-template-columns:repeat(auto-fill, minmax(42px, 1fr));gap:4px;padding:7px;}
  .pal-item{display:grid;place-items:center;padding:6px 2px;aspect-ratio:1.4;
    border:1px solid var(--border);border-radius:7px;background:var(--panel);cursor:pointer;
    transition:all .13s ease;}
  .pal-item:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);
    box-shadow:0 3px 8px rgba(79,70,229,.15);}
  .pal-item svg{display:block;max-width:100%;max-height:100%;}
  .hints{list-style:none;padding:0;margin:0;font-size:11.5px;color:var(--muted);line-height:1.65;}
  .hints li{padding-left:14px;position:relative;margin-bottom:5px;}
  .hints li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-weight:700;}
  .hints b{color:var(--text);font-weight:600;}
  .canvas-wrap{flex:1;position:relative;overflow:hidden;background-color:var(--bg);
    background-image:radial-gradient(circle,var(--grid-dot) 1px,transparent 1px);
    background-size:20px 20px;cursor:default;transition:background-color .2s;}
  #svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;}
  #svg.panning{cursor:grabbing !important;}
  #svg.linking{cursor:crosshair !important;}
  .node{cursor:move;}
  .node.locked{cursor:not-allowed;}
  .node path{transition:filter .12s;}
  .node:hover path.node-shape{filter:drop-shadow(0 3px 7px rgba(30,40,80,.16));}
  .port{cursor:crosshair;}
  .port .port-dot{opacity:0;transition:opacity .13s;pointer-events:none;}
  .node:hover .port .port-dot,.node.selected .port .port-dot,.port:hover .port-dot{opacity:1;}
  .port:hover .port-dot{fill:var(--accent) !important;stroke:var(--accent) !important;}
  .node.selected .sel-outline{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;
    pointer-events:none;opacity:.85;}
  .lock-badge{pointer-events:none;}
  .edge .hit{stroke:transparent;stroke-width:18;fill:none;cursor:pointer;}
  .edge .line{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:filter .12s;}
  .edge:hover .line{filter:drop-shadow(0 0 4px rgba(79,70,229,.5));}
  .edge.selected .line{stroke:var(--accent) !important;}
  .edge text{font-family:inherit;font-size:11.5px;fill:#475569;pointer-events:none;user-select:none;}
  body.dark .edge text{fill:#a8b0c4;}
  .handle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;cursor:nwse-resize;}
  .target-highlight{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:8 5;pointer-events:none;}
  .guide-line{stroke:var(--guide);stroke-width:1;stroke-dasharray:4 3;pointer-events:none;}
  .zoombar{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:7px;
    background:var(--panel);opacity:.94;backdrop-filter:blur(8px);border:1px solid var(--border);
    border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-size:11.5px;color:var(--muted);}
  .zoombar b{color:var(--text);font-weight:600;}
  .mode-indicator{position:absolute;top:14px;left:14px;background:var(--panel);opacity:.94;
    backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:5px 10px;
    font-size:11.5px;color:var(--muted);box-shadow:var(--shadow);pointer-events:none;
    transition:opacity .2s;opacity:0;}
  .mode-indicator.show{opacity:1;}
  .minimap{position:absolute;right:14px;bottom:14px;width:200px;height:140px;
    background:var(--panel);opacity:.96;backdrop-filter:blur(8px);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;}
  .minimap svg{width:100%;height:100%;display:block;}
  .minimap-viewport{fill:rgba(79,70,229,.10);stroke:var(--accent);stroke-width:1.5;}
  .search-panel{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 40px rgba(20,30,60,.16);
    padding:8px;display:none;z-index:30;width:340px;}
  .search-panel.show{display:block;}
  .search-panel input{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;width:100%;outline:none;color:var(--text);background:var(--subtle);}
  .search-panel input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search-results{max-height:280px;overflow-y:auto;margin-top:6px;}
  .search-result{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;
    display:flex;align-items:center;gap:8px;}
  .search-result:hover{background:var(--accent-soft);color:var(--accent);}
  .search-result .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .search-result .meta{margin-left:auto;font-size:10.5px;color:var(--muted);}
  .search-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px;}
  .cmd-overlay{position:fixed;inset:0;background:rgba(20,30,60,.35);backdrop-filter:blur(3px);
    z-index:2000;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;}
  .cmd-overlay.show{display:flex;}
  .cmd-palette{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 24px 80px rgba(20,30,60,.4);width:min(560px,calc(100vw - 32px));
    max-height:60vh;display:flex;flex-direction:column;overflow:hidden;
    animation:cmdIn .16s cubic-bezier(.2,.8,.4,1);}
  @keyframes cmdIn{from{opacity:0;transform:translateY(-10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .cmd-input{border:none;outline:none;padding:16px 20px;font-size:15px;font-family:inherit;
    background:transparent;color:var(--text);border-bottom:1px solid var(--border);}
  .cmd-input::placeholder{color:var(--muted);}
  .cmd-list{overflow-y:auto;padding:6px;flex:1;}
  .cmd-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;
    cursor:pointer;font-size:13px;color:var(--text);transition:background .08s;}
  .cmd-item:hover,.cmd-item.active{background:var(--accent-soft);color:var(--accent);}
  .cmd-item .cmd-icon{width:20px;text-align:center;opacity:.75;font-size:14px;}
  .cmd-item .cmd-label{flex:1;}
  .cmd-item .cmd-shortcut{margin-left:auto;font-size:10.5px;color:var(--muted);
    font-family:ui-monospace,monospace;background:var(--subtle);padding:2px 7px;
    border-radius:5px;border:1px solid var(--border);}
  .cmd-item:hover .cmd-shortcut,.cmd-item.active .cmd-shortcut{color:var(--accent);}
  .cmd-empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
  .inspector{width:270px;flex:0 0 270px;background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;padding:14px;}
  .insp-title{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .insp-title:not(:first-child){margin-top:20px;}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
  .fld>span{font-size:11.5px;color:var(--muted);font-weight:500;}
  .fld input[type=text],.fld input[type=number],.fld textarea,.fld select{font-family:inherit;
    font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;
    background:var(--subtle);color:var(--text);outline:none;width:100%;transition:all .13s;resize:vertical;}
  .fld textarea{line-height:1.4;min-height:56px;}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);background:var(--panel);
    box-shadow:0 0 0 3px var(--accent-soft);}
  .fld textarea.flash-focus{animation:flashFocus .6s ease-out;}
  @keyframes flashFocus{
    0%{box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel);}
    50%{box-shadow:0 0 0 8px var(--accent-soft);background:var(--panel);}
    100%{box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel);}
  }
  .fld input[type=color]{width:100%;height:34px;padding:3px;border:1px solid var(--border);
    border-radius:8px;background:var(--subtle);cursor:pointer;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .empty-state{color:var(--muted);font-size:12.5px;text-align:center;padding:44px 14px;line-height:1.8;}
  .empty-state .big{font-size:32px;display:block;margin-bottom:10px;opacity:.35;}
  .swatch-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
  .swatch{width:22px;height:22px;border-radius:6px;border:2px solid var(--panel);cursor:pointer;
    box-shadow:0 0 0 1px var(--border);transition:transform .12s;}
  .swatch:hover{transform:scale(1.15);}
  .align-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:8px;}
  .align-btn{padding:7px 0;border:1px solid var(--border);border-radius:7px;background:var(--panel);
    cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:13px;transition:all .12s;}
  .align-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .seg{display:grid;grid-auto-flow:column;border:1px solid var(--border);border-radius:8px;
    overflow:hidden;background:var(--subtle);}
  .seg button{border-radius:0;border:none;background:transparent;padding:6px 8px;font-size:12px;
    color:var(--muted);justify-content:center;}
  .seg button:hover{background:var(--hover);color:var(--text);}
  .seg button.active{background:var(--accent);color:#fff;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,60,.5);backdrop-filter:blur(3px);
    z-index:500;display:none;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel);border-radius:16px;box-shadow:0 24px 80px rgba(20,30,60,.35);
    max-width:560px;width:calc(100% - 32px);max-height:80vh;overflow-y:auto;
    animation:modalIn .18s cubic-bezier(.2,.8,.4,1);}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-header{padding:18px 22px 12px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;}
  .modal-header h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px;}
  .modal-body{padding:16px 22px;}
  .modal-footer{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px;
    border-top:1px solid var(--border);}
  .modal-footer button{padding:8px 14px;font-size:13px;}
  .shortcut-section{margin-bottom:16px;}
  .shortcut-section h3{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px;}
  .shortcut-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
    font-size:12.5px;border-bottom:1px dashed var(--border);}
  .shortcut-row:last-child{border-bottom:none;}

  .ctx-menu{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:11px;

    cursor:pointer;color:var(--text);user-select:none;transition:background .1s;}

    text-transform:uppercase;color:var(--muted);}
  .ctx-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:5px 10px 8px;}
  .ctx-swatches .sw{width:100%;aspect-ratio:1;border-radius:6px;cursor:pointer;border:2px solid var(--panel);
    box-shadow:0 0 0 1px var(--border);transition:transform .12s;}
  .ctx-swatches .sw:hover{transform:scale(1.14);}

    max-height:280px;overflow-y:auto;}

  .ctx-buttons{display:grid;grid-auto-flow:column;gap:4px;padding:5px 8px 8px;grid-auto-columns:1fr;}
  .ctx-btn{border:1px solid var(--border);background:var(--panel);padding:6px 4px;border-radius:7px;
    cursor:pointer;display:grid;place-items:center;font-size:11.5px;color:var(--text);
    transition:all .12s;min-width:0;font-family:inherit;}
  .ctx-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .ctx-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .modal-input{font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--border);
    border-radius:8px;width:100%;background:var(--subtle);color:var(--text);outline:none;
    margin-top:10px;}
  .modal-input:focus{border-color:var(--accent);background:var(--panel);
    box-shadow:0 0 0 3px var(--accent-soft);}
  .modal-msg{font-size:13.5px;line-height:1.6;color:var(--text);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 12px 40px rgba(20,30,60,.25);padding:10px 18px;font-size:13px;
    color:var(--text);z-index:3000;opacity:0;transition:all .22s cubic-bezier(.2,.8,.4,1);
    display:flex;align-items:center;gap:10px;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .toast-icon{font-size:16px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}

  ::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  #errorBanner{position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:10px 16px;
    font-family:monospace;font-size:12px;z-index:9999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.3);}
  .tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 8px 8px;}
  .tpl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
    cursor:pointer;font-size:12.5px;color:var(--text);border:1px solid transparent;transition:all .1s;}

  body.palette-hidden #btnTogglePalette{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
</style>

<script>
'use strict';

const $ = id => document.getElementById(id);
const click = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };

const safeStorage = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (_) { return false; } },
  remove(k) { try { localStorage.removeItem(k); return true; } catch (_) { return false; } }
};

function showError(msg) {
  const b = $('errorBanner');
  if (!b) { console.error(msg); return; }
  b.style.display = 'block';
  b.textContent = 'Lỗi: ' + msg + '  (nhấn để ẩn)';
  b.onclick = () => { b.style.display = 'none'; };
}
window.addEventListener('error', e => {
  try { showError((e.message || 'unknown') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?')); } catch (_) {}
});

const NS = 'http://www.w3.org/2000/svg';
const FONT = "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
const GRID = 20, MIN_FONT = 5, MAX_FONT = 72;

const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'n' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- Custom Modal ---------- */
let dlgResolver = null;
let dlgKind = 'alert';
function showDialog(opts) {
  return new Promise(resolve => {
    dlgResolver = resolve;
    dlgKind = opts.kind || 'alert';
    const modal = $('dlgModal');
    if (!modal) { resolve(null); return; }
    $('dlgTitle').textContent = opts.title || 'Thông báo';
    $('dlgMessage').textContent = opts.message || '';
    const inp = $('dlgInput');
    if (dlgKind === 'prompt') {
      inp.style.display = 'block';
      inp.value = opts.defaultValue || '';
    } else { inp.style.display = 'none'; }
    $('dlgCancel').style.display = dlgKind === 'alert' ? 'none' : 'inline-flex';
    $('dlgOk').textContent = opts.okText || (dlgKind === 'confirm' ? 'Đồng ý' : 'OK');
    $('dlgCancel').textContent = opts.cancelText || 'Huỷ';
    modal.classList.add('show');
    setTimeout(() => {
      if (dlgKind === 'prompt') { inp.focus(); inp.select(); }
      else { $('dlgOk').focus(); }
    }, 40);
  });
}
function showConfirm(m, o) { return showDialog(Object.assign({ kind: 'confirm', message: m }, o || {})); }
function showPrompt(m, d, o) { return showDialog(Object.assign({ kind: 'prompt', message: m, defaultValue: d }, o || {})); }
function showAlert(m, o) { return showDialog(Object.assign({ kind: 'alert', message: m }, o || {})); }
function closeDialog(result) {
  const modal = $('dlgModal');
  if (modal) modal.classList.remove('show');
  const r = dlgResolver; dlgResolver = null;
  if (r) r(result);
}
function okDialog() {
  if (dlgKind === 'prompt') closeDialog($('dlgInput').value);
  else closeDialog(true);
}
function cancelDialog() {
  if (dlgKind === 'prompt') closeDialog(null);
  else if (dlgKind === 'confirm') closeDialog(false);
  else closeDialog(true);
}
click('dlgOk', okDialog);
click('dlgCancel', cancelDialog);
click('dlgClose', cancelDialog);
if ($('dlgModal')) {
  $('dlgModal').addEventListener('click', e => { if (e.target === $('dlgModal')) cancelDialog(); });
  $('dlgInput').addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); okDialog(); }
    if (e.key === 'Escape') { e.preventDefault(); cancelDialog(); }
  });
}

let toastTimer = null;
function toast(text, type) {
  const t = $('toast');
  if (!t) return;
  const icons = { success: '✓', warning: '⚠', danger: '✕', info: 'ℹ' };
  const cls = type || 'info';
  t.className = 'toast ' + cls;
  t.querySelector('.toast-icon').textContent = icons[cls] || 'ℹ';
  t.querySelector('.toast-text').textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function regularPolygon(cx, cy, rx, ry, n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    pts.push([cx + Math.cos(angle) * rx, cy + Math.sin(angle) * ry]);
  }
  let d = 'M ' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
  for (let i = 1; i < pts.length; i++) d += ' L ' + pts[i][0].toFixed(2) + ' ' + pts[i][1].toFixed(2);
  return d + ' Z';
}
function starPath(cx, cy, rx, ry, points, innerRatio) {
  const pts = [];
  const n = points * 2;
  for (let i = 0; i < n; i++) {
    const r = i % 2 === 0 ? 1 : innerRatio;
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    pts.push([cx + Math.cos(angle) * rx * r, cy + Math.sin(angle) * ry * r]);
  }
  let d = 'M ' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
  for (let i = 1; i < pts.length; i++) d += ' L ' + pts[i][0].toFixed(2) + ' ' + pts[i][1].toFixed(2);
  return d + ' Z';
}

function shapePaths(type, x, y, w, h) {
  const rr = rad => {
    rad = Math.min(rad, w / 2, h / 2);
    return 'M ' + (x + rad) + ' ' + y + ' H ' + (x + w - rad) + ' A ' + rad + ' ' + rad + ' 0 0 1 ' + (x + w) + ' ' + (y + rad) +
           ' V ' + (y + h - rad) + ' A ' + rad + ' ' + rad + ' 0 0 1 ' + (x + w - rad) + ' ' + (y + h) +
           ' H ' + (x + rad) + ' A ' + rad + ' ' + rad + ' 0 0 1 ' + x + ' ' + (y + h - rad) +
           ' V ' + (y + rad) + ' A ' + rad + ' ' + rad + ' 0 0 1 ' + (x + rad) + ' ' + y + ' Z';
  };
  const cx = x + w / 2, cy = y + h / 2;
  switch (type) {
    case 'rect': return ['M ' + x + ' ' + y + ' H ' + (x + w) + ' V ' + (y + h) + ' H ' + x + ' Z'];
    case 'rect_round': return [rr(Math.min(14, w * 0.1, h * 0.2))];
    case 'square': return [rr(8)];
    case 'oval': return [rr(h / 2)];
    case 'circle': return [regularPolygon(cx, cy, w / 2, h / 2, 64)];
    case 'diamond': return ['M ' + cx + ' ' + y + ' L ' + (x + w) + ' ' + cy + ' L ' + cx + ' ' + (y + h) + ' L ' + x + ' ' + cy + ' Z'];
    case 'triangle': return ['M ' + cx + ' ' + y + ' L ' + (x + w) + ' ' + (y + h) + ' L ' + x + ' ' + (y + h) + ' Z'];
    case 'triangle_down': return ['M ' + x + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + cx + ' ' + (y + h) + ' Z'];
    case 'triangle_left': return ['M ' + (x + w) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h) + ' L ' + x + ' ' + cy + ' Z'];
    case 'triangle_right': return ['M ' + x + ' ' + y + ' L ' + (x + w) + ' ' + cy + ' L ' + x + ' ' + (y + h) + ' Z'];
    case 'pentagon': return [regularPolygon(cx, cy, w / 2, h / 2, 5)];
    case 'hexagon': return [regularPolygon(cx, cy, w / 2, h / 2, 6)];
    case 'heptagon': return [regularPolygon(cx, cy, w / 2, h / 2, 7)];
    case 'octagon': return [regularPolygon(cx, cy, w / 2, h / 2, 8)];
    case 'star': return [starPath(cx, cy, w / 2, h / 2, 5, 0.42)];
    case 'parallelogram': { const o = Math.min(w * 0.18, 26);
      return ['M ' + (x + o) + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + (x + w - o) + ' ' + (y + h) + ' L ' + x + ' ' + (y + h) + ' Z']; }
    case 'parallelogram_inv': { const o = Math.min(w * 0.18, 26);
      return ['M ' + x + ' ' + y + ' L ' + (x + w - o) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h) + ' L ' + (x + o) + ' ' + (y + h) + ' Z']; }
    case 'trapezoid': { const o = Math.min(w * 0.14, 26);
      return ['M ' + x + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + (x + w - o) + ' ' + (y + h) + ' L ' + (x + o) + ' ' + (y + h) + ' Z']; }
    case 'trapezoid_inv': { const o = Math.min(w * 0.14, 26);
      return ['M ' + (x + o) + ' ' + y + ' L ' + (x + w - o) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h) + ' L ' + x + ' ' + (y + h) + ' Z']; }
    case 'cross': { const c = Math.min(w, h) * 0.28;
      return ['M ' + (x + c) + ' ' + y + ' L ' + (x + w - c) + ' ' + y + ' L ' + (x + w - c) + ' ' + (y + c) + ' L ' + (x + w) + ' ' + (y + c) + ' L ' + (x + w) + ' ' + (y + h - c) + ' L ' + (x + w - c) + ' ' + (y + h - c) + ' L ' + (x + w - c) + ' ' + (y + h) + ' L ' + (x + c) + ' ' + (y + h) + ' L ' + (x + c) + ' ' + (y + h - c) + ' L ' + x + ' ' + (y + h - c) + ' L ' + x + ' ' + (y + c) + ' L ' + (x + c) + ' ' + (y + c) + ' Z']; }
    case 'chevron': { const c = w * 0.18;
      return ['M ' + x + ' ' + y + ' L ' + (x + w - c) + ' ' + y + ' L ' + (x + w) + ' ' + cy + ' L ' + (x + w - c) + ' ' + (y + h) + ' L ' + x + ' ' + (y + h) + ' L ' + (x + c) + ' ' + cy + ' Z']; }
    case 'arrow_right': { const bh = Math.max(h * 0.4, 12), hh = h / 2, bw = w * 0.55;
      const yT = y + hh - bh / 2, yB = y + hh + bh / 2;
      return ['M ' + x + ' ' + yT + ' L ' + (x + bw) + ' ' + yT + ' L ' + (x + bw) + ' ' + y + ' L ' + (x + w) + ' ' + hh + ' L ' + (x + bw) + ' ' + (y + h) + ' L ' + (x + bw) + ' ' + yB + ' L ' + x + ' ' + yB + ' Z']; }
    case 'arrow_left': { const bh = Math.max(h * 0.4, 12), hh = h / 2, bw = w * 0.55;
      const yT = y + hh - bh / 2, yB = y + hh + bh / 2;
      return ['M ' + (x + w) + ' ' + yT + ' L ' + (x + w - bw) + ' ' + yT + ' L ' + (x + w - bw) + ' ' + y + ' L ' + x + ' ' + hh + ' L ' + (x + w - bw) + ' ' + (y + h) + ' L ' + (x + w - bw) + ' ' + yB + ' L ' + (x + w) + ' ' + yB + ' Z']; }
    case 'arrow_up': { const bw = Math.max(w * 0.4, 12), cx2 = x + w / 2, bh = h * 0.55;
      const xL = cx2 - bw / 2, xR = cx2 + bw / 2;
      return ['M ' + xL + ' ' + (y + h) + ' L ' + xL + ' ' + (y + h - bh) + ' L ' + x + ' ' + (y + h - bh) + ' L ' + cx2 + ' ' + y + ' L ' + (x + w) + ' ' + (y + h - bh) + ' L ' + xR + ' ' + (y + h - bh) + ' L ' + xR + ' ' + (y + h) + ' Z']; }
    case 'arrow_down': { const bw = Math.max(w * 0.4, 12), cx2 = x + w / 2, bh = h * 0.55;
      const xL = cx2 - bw / 2, xR = cx2 + bw / 2;
      return ['M ' + xL + ' ' + y + ' L ' + xL + ' ' + (y + bh) + ' L ' + x + ' ' + (y + bh) + ' L ' + cx2 + ' ' + (y + h) + ' L ' + (x + w) + ' ' + (y + bh) + ' L ' + xR + ' ' + (y + bh) + ' L ' + xR + ' ' + y + ' Z']; }
    case 'arrow_double': { const bh = Math.max(h * 0.4, 12), hh = h / 2, aw = w * 0.25;
      const yT = y + hh - bh / 2, yB = y + hh + bh / 2;
      return ['M ' + (x + aw) + ' ' + yT + ' L ' + (x + w - aw) + ' ' + yT + ' L ' + (x + w - aw) + ' ' + y + ' L ' + (x + w) + ' ' + hh + ' L ' + (x + w - aw) + ' ' + (y + h) + ' L ' + (x + w - aw) + ' ' + yB + ' L ' + (x + aw) + ' ' + yB + ' L ' + (x + aw) + ' ' + (y + h) + ' L ' + x + ' ' + hh + ' L ' + (x + aw) + ' ' + y + ' Z']; }
    case 'document': { const k = h * 0.22;
      return ['M ' + x + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h - k) +
              ' C ' + (x + w * 0.72) + ' ' + (y + h + k * 0.9) + ' ' + (x + w * 0.28) + ' ' + (y + h - k * 1.9) + ' ' + x + ' ' + (y + h - k) + ' Z']; }
    case 'cylinder': { const ry = Math.min(h * 0.16, 18), rx = w / 2;
      return ['M ' + x + ' ' + (y + ry) + ' L ' + x + ' ' + (y + h - ry) + ' A ' + rx + ' ' + ry + ' 0 0 0 ' + (x + w) + ' ' + (y + h - ry) +
              ' L ' + (x + w) + ' ' + (y + ry) + ' A ' + rx + ' ' + ry + ' 0 0 1 ' + x + ' ' + (y + ry) + ' Z',
              'M ' + x + ' ' + (y + ry) + ' A ' + rx + ' ' + ry + ' 0 0 0 ' + (x + w) + ' ' + (y + ry)]; }
    case 'predefined': { const off = w * 0.11;
      return [rr(8), 'M ' + (x + off) + ' ' + y + ' L ' + (x + off) + ' ' + (y + h), 'M ' + (x + w - off) + ' ' + y + ' L ' + (x + w - off) + ' ' + (y + h)]; }
    case 'note': { const f = Math.min(w, h) * 0.28;
      return ['M ' + x + ' ' + y + ' L ' + (x + w - f) + ' ' + y + ' L ' + (x + w) + ' ' + (y + f) + ' L ' + (x + w) + ' ' + (y + h) + ' L ' + x + ' ' + (y + h) + ' Z',
              'M ' + (x + w - f) + ' ' + y + ' L ' + (x + w - f) + ' ' + (y + f) + ' L ' + (x + w) + ' ' + (y + f)]; }
    case 'internal_storage':
      return [rr(0), 'M ' + (x + w * 0.2) + ' ' + y + ' L ' + (x + w * 0.2) + ' ' + (y + h), 'M ' + x + ' ' + (y + h * 0.25) + ' L ' + (x + w) + ' ' + (y + h * 0.25)];
    case 'stored_data': { const c = w * 0.15;
      return ['M ' + (x + c) + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h) + ' L ' + (x + c) + ' ' + (y + h) +
              ' C ' + (x - c * 0.3) + ' ' + (y + h * 0.75) + ' ' + (x - c * 0.3) + ' ' + (y + h * 0.25) + ' ' + (x + c) + ' ' + y + ' Z']; }
    case 'manual_input': { const s = h * 0.25;
      return ['M ' + x + ' ' + (y + s) + ' L ' + (x + w) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h) + ' L ' + x + ' ' + (y + h) + ' Z']; }
    case 'display': { const c = w * 0.15;
      return ['M ' + (x + c) + ' ' + y + ' C ' + (x + c) + ' ' + (y + h * 0.4) + ' ' + x + ' ' + (y + h * 0.6) + ' ' + x + ' ' + (y + h) +
              ' L ' + (x + w) + ' ' + (y + h) + ' C ' + (x + w) + ' ' + (y + h * 0.6) + ' ' + (x + w - c) + ' ' + (y + h * 0.4) + ' ' + (x + w - c) + ' ' + y + ' Z']; }
    case 'delay': { const r = h / 2;
      return ['M ' + x + ' ' + y + ' L ' + (x + w - r) + ' ' + y + ' A ' + r + ' ' + r + ' 0 0 1 ' + (x + w - r) + ' ' + (y + h) + ' L ' + x + ' ' + (y + h) + ' Z']; }
    case 'loop_limit': { const s = w * 0.15;
      return ['M ' + x + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + (x + w - s) + ' ' + (y + h) + ' L ' + (x + s) + ' ' + (y + h) + ' Z']; }
    case 'merge': return ['M ' + x + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + cx + ' ' + (y + h) + ' Z'];
    case 'or_node': { const rx = w / 2, ry = h / 2, s = Math.min(w, h) * 0.22;
      return ['M ' + x + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 1 1 ' + (x + w) + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 1 1 ' + x + ' ' + cy + ' Z',
              'M ' + (cx - s) + ' ' + cy + ' L ' + (cx + s) + ' ' + cy, 'M ' + cx + ' ' + (cy - s) + ' L ' + cx + ' ' + (cy + s)]; }
    case 'summing': { const rx = w / 2, ry = h / 2, s = Math.min(w, h) * 0.22;
      return ['M ' + x + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 1 1 ' + (x + w) + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 1 1 ' + x + ' ' + cy + ' Z',
              'M ' + (cx - s) + ' ' + (cy - s) + ' L ' + (cx + s) + ' ' + (cy + s), 'M ' + (cx + s) + ' ' + (cy - s) + ' L ' + (cx - s) + ' ' + (cy + s)]; }
    case 'offpage': { const f = h * 0.35;
      return ['M ' + x + ' ' + y + ' L ' + (x + w) + ' ' + y + ' L ' + (x + w) + ' ' + (y + h - f) + ' L ' + cx + ' ' + (y + h) + ' L ' + x + ' ' + (y + h - f) + ' Z']; }
    case 'annotation': { const ox = w * 0.20;
      return ['M ' + (x + w) + ' ' + y + ' L ' + (x + ox) + ' ' + y + ' L ' + (x + ox) + ' ' + (y + h) + ' L ' + (x + w) + ' ' + (y + h)]; }
  }
  return [rr(10)];
}

function shapeInnerPad(type, w, h) {
  const m = Math.min(w, h);
  switch (type) {
    case 'diamond': return m * 0.28;
    case 'circle': return m * 0.22;
    case 'oval': return Math.min(w * 0.14, h * 0.14);
    case 'triangle': case 'triangle_down': return m * 0.32;
    case 'triangle_left': case 'triangle_right': return m * 0.28;
    case 'pentagon': case 'heptagon': return m * 0.22;
    case 'hexagon': case 'octagon': return m * 0.20;
    case 'star': return m * 0.36;
    case 'parallelogram': case 'parallelogram_inv': return m * 0.19;
    case 'trapezoid': case 'trapezoid_inv': return m * 0.18;
    case 'cross': return m * 0.30;
    case 'chevron': return m * 0.26;
    case 'arrow_right': case 'arrow_left': return w * 0.12;
    case 'arrow_up': case 'arrow_down': return h * 0.12;
    case 'arrow_double': return w * 0.16;
    case 'merge': return m * 0.24;
    case 'or_node': case 'summing': return m * 0.32;
    case 'delay': return h * 0.10;
    case 'display': return m * 0.16;
    case 'manual_input': return h * 0.16;
    case 'predefined': return w * 0.14;
    case 'annotation': return w * 0.24;
    case 'internal_storage': return w * 0.26;
    case 'stored_data': return w * 0.22;
    case 'loop_limit': return w * 0.16;
    case 'note': return m * 0.10;
    case 'document': return m * 0.12;
    case 'offpage': return h * 0.22;
    default: return 14;
  }
}

/* ---------- PAGES ---------- */
let pages = [];
let activePageId = null;
let styleClipboard = null;

function newPage(name) {
  return {
    id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6),
    name: name || ('Trang ' + (pages.length + 1)),
    nodes: [], edges: [], view: { x: 0, y: 0, k: 1 }
  };
}
function saveCurrentPage() {
  const p = pages.find(x => x.id === activePageId);
  if (p) { p.nodes = nodes; p.edges = edges; p.view = { x: view.x, y: view.y, k: view.k }; }
}
function loadPage(id) {
  saveCurrentPage();
  activePageId = id;
  const p = pages.find(x => x.id === id);
  if (!p) return;
  nodes = p.nodes; edges = p.edges;
  view.x = p.view.x; view.y = p.view.y; view.k = p.view.k;
  selected.nodes.clear(); selected.edges.clear();
  history = []; hIndex = -1;
  render();
  pushHistory();
  updateUndoButtons();
  renderTabs();
  // Auto-scroll active tab vào view
  setTimeout(scrollActiveTabIntoView, 30);
}
function addPage() {
  saveCurrentPage();
  const p = newPage();
  pages.push(p);
  loadPage(p.id);
  toast('Đã tạo ' + p.name, 'success');
}
function removePage(id) {
  if (pages.length <= 1) { toast('Không thể xoá trang cuối', 'warning'); return; }
  const idx = pages.findIndex(p => p.id === id);
  if (idx < 0) return;
  const wasActive = (activePageId === id);
  pages.splice(idx, 1);
  if (wasActive) loadPage(pages[Math.min(idx, pages.length - 1)].id);
  else renderTabs();
  toast('Đã đóng tab', 'success');
}
async function renamePage(id) {
  const p = pages.find(x => x.id === id);
  if (!p) return;
  const name = await showPrompt('Đổi tên trang:', p.name, { title: 'Đổi tên', okText: 'Lưu' });
  if (name !== null && name.trim()) { p.name = name.trim(); renderTabs(); toast('Đã đổi tên', 'success'); }
}
function duplicatePage(id) {
  saveCurrentPage();
  const p = pages.find(x => x.id === id);
  if (!p) return;
  const np = newPage(p.name + ' (copy)');
  np.nodes = JSON.parse(JSON.stringify(p.nodes));
  const idMap = new Map();
  np.nodes.forEach(n => { const old = n.id; n.id = uid(); idMap.set(old, n.id); });
  np.edges = JSON.parse(JSON.stringify(p.edges));
  np.edges.forEach(e => { e.id = uid(); e.from = idMap.get(e.from) || e.from; e.to = idMap.get(e.to) || e.to; });
  np.view = { x: p.view.x, y: p.view.y, k: p.view.k };
  pages.push(np);
  renderTabs();
  toast('Đã nhân bản → ' + np.name, 'success');
}
function reorderPages(dragId, targetId) {
  const fromIdx = pages.findIndex(p => p.id === dragId);
  const toIdx = pages.findIndex(p => p.id === targetId);
  if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
  const moved = pages.splice(fromIdx, 1)[0];
  pages.splice(toIdx, 0, moved);
  renderTabs();
}
function gotoPageIndex(i) {
  if (i < 0 || i >= pages.length) return;
  if (pages[i].id !== activePageId) loadPage(pages[i].id);
}
function nextPage() { const i = pages.findIndex(p => p.id === activePageId); gotoPageIndex((i + 1) % pages.length); }
function prevPage() { const i = pages.findIndex(p => p.id === activePageId); gotoPageIndex((i - 1 + pages.length) % pages.length); }

/* ==================================================================
   RENDER TABS — với scroll buttons + dropdown + drag scroll
   ================================================================== */
function renderTabs() {
  const tabsList = $('tabsList');
  if (!tabsList) return;
  tabsList.innerHTML = '';
  pages.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'tab' + (p.id === activePageId ? ' active' : '');
    el.draggable = true;
    el.dataset.pageId = p.id;
    el.title = p.name + (i + 1 <= 9 ? '  (Ctrl+' + (i + 1) + ')' : '');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'tab-name';
    nameSpan.textContent = p.name;
    el.appendChild(nameSpan);

    if (pages.length > 1) {
      const closeBtn = document.createElement('span');
      closeBtn.className = 'tab-close';
      closeBtn.textContent = '×';
      closeBtn.title = 'Đóng tab';
      closeBtn.addEventListener('pointerdown', ev => ev.stopPropagation());
      closeBtn.addEventListener('pointerup', ev => { ev.stopPropagation(); ev.preventDefault(); removePage(p.id); });
      closeBtn.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); });
      el.appendChild(closeBtn);
    }

    el.addEventListener('click', ev => {
      if (ev.target.classList.contains('tab-close')) return;
      if (p.id !== activePageId) loadPage(p.id);
    });
    el.addEventListener('auxclick', ev => {
      if (ev.button === 1 && pages.length > 1) { ev.preventDefault(); removePage(p.id); }
    });
    el.addEventListener('dblclick', ev => {
      if (ev.target.classList.contains('tab-close')) return;
      renamePage(p.id);
    });
    el.addEventListener('contextmenu', ev => { ev.preventDefault(); showTabContextMenu(ev, p.id); });
    el.addEventListener('dragstart', ev => {
      ev.dataTransfer.effectAllowed = 'move';
      try { ev.dataTransfer.setData('text/plain', p.id); } catch (_) {}
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('dragover', ev => { ev.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', ev => {
      ev.preventDefault();
      el.classList.remove('drag-over');
      const draggedId = ev.dataTransfer.getData('text/plain');
      if (draggedId && draggedId !== p.id) reorderPages(draggedId, p.id);
    });
    tabsList.appendChild(el);
  });

  updateTabScrollButtons();
  // Auto scroll active tab vào view
  setTimeout(scrollActiveTabIntoView, 20);
  updateTabDropdownBtnState();
}

function scrollActiveTabIntoView() {
  const tabsList = $('tabsList');
  if (!tabsList) return;
  const activeEl = tabsList.querySelector('.tab.active');
  if (activeEl && activeEl.scrollIntoView) {
    try {
      activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    } catch (_) {}
  }
  // Cập nhật lại scroll buttons sau khi cuộn
  setTimeout(updateTabScrollButtons, 260);
}

function updateTabScrollButtons() {
  const tabsList = $('tabsList');
  const leftBtn = $('tabScrollLeft');
  const rightBtn = $('tabScrollRight');
  if (!tabsList || !leftBtn || !rightBtn) return;

  const hasOverflow = tabsList.scrollWidth > tabsList.clientWidth + 2;
  const atStart = tabsList.scrollLeft <= 2;
  const atEnd = tabsList.scrollLeft + tabsList.clientWidth >= tabsList.scrollWidth - 2;

  leftBtn.classList.toggle('visible', hasOverflow && !atStart);
  rightBtn.classList.toggle('visible', hasOverflow && !atEnd);
  leftBtn.disabled = atStart;
  rightBtn.disabled = atEnd;
}

function updateTabDropdownBtnState() {
  const btn = $('tabDropdownBtn');

/* Scroll buttons */
function scrollTabsBy(dir) {
  const tabsList = $('tabsList');
  if (!tabsList) return;
  const amount = Math.max(120, tabsList.clientWidth * 0.6);
  tabsList.scrollBy({ left: dir * amount, behavior: 'smooth' });
  setTimeout(updateTabScrollButtons, 260);
}
click('tabScrollLeft', () => scrollTabsBy(-1));

/* Middle mouse wheel on tabs to scroll horizontally */
(function attachTabsWheel() {
  const tabsList = $('tabsList');
  if (!tabsList) return;
  tabsList.addEventListener('wheel', e => {
    // Scroll ngang khi có overflow
    if (tabsList.scrollWidth <= tabsList.clientWidth + 2) return;
    // Chuyển wheel dọc thành scroll ngang
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      tabsList.scrollLeft += e.deltaY;
      e.preventDefault();
      updateTabScrollButtons();
    }
  }, { passive: false });
  // Cập nhật scroll buttons khi cuộn
  tabsList.addEventListener('scroll', updateTabScrollButtons, { passive: true });
})();

/* Drag scroll: kéo vùng trống của tabsbar để cuộn */
(function attachDragScroll() {
  const tabsList = $('tabsList');
  if (!tabsList) return;
  let isDragging = false;
  let startX = 0, startScrollLeft = 0;
  let moved = false;

  tabsList.addEventListener('pointerdown', e => {
    // Chỉ kích hoạt khi click vào vùng trống (không phải tab, không phải scroll btn)
    if (e.target !== tabsList) return;
    if (e.button !== 0) return;
    isDragging = true;
    moved = false;
    startX = e.clientX;
    startScrollLeft = tabsList.scrollLeft;
    tabsList.classList.add('dragging');
    try { tabsList.setPointerCapture(e.pointerId); } catch (_) {}
  });
  tabsList.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 3) moved = true;
    tabsList.scrollLeft = startScrollLeft - dx;
    updateTabScrollButtons();
  });
  const endDrag = (e) => {
    if (!isDragging) return;
    isDragging = false;
    tabsList.classList.remove('dragging');
    try { tabsList.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  tabsList.addEventListener('pointerup', endDrag);
  tabsList.addEventListener('pointercancel', endDrag);
})();

/* ==================================================================
   TAB DROPDOWN — danh sách tất cả tab
   ================================================================== */
function openTabDropdown() {
  const dd = $('tabDropdown');
  const btn = $('tabDropdownBtn');
  if (!dd || !btn) return;
  if (dd.classList.contains('show')) { closeTabDropdown(); return; }

  dd.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'tab-dropdown-header';
  header.innerHTML = '<span>Danh sách tab</span><span class="count">' + pages.length + ' trang</span>';
  dd.appendChild(header);

  pages.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'tab-dropdown-item' + (p.id === activePageId ? ' active' : '');
    item.innerHTML =
      '<span class="num">' + (i + 1 <= 9 ? (i + 1) : '·') + '</span>' +
      '<span class="name">' + esc(p.name) + '</span>' +
      (pages.length > 1 ? '<span class="close" title="Đóng tab">×</span>' : '');
    item.addEventListener('click', ev => {
      if (ev.target.classList.contains('close')) {
        ev.stopPropagation();
        removePage(p.id);
        if (pages.length > 0 && dd.classList.contains('show')) {
          setTimeout(openTabDropdown, 10); // refresh
          openTabDropdown();
        }
        return;
      }
      if (p.id !== activePageId) loadPage(p.id);
      closeTabDropdown();
    });
    item.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      closeTabDropdown();
      showTabContextMenu(ev, p.id);
    });
    dd.appendChild(item);
  });

  if (pages.length > 1) {
    const sep = document.createElement('div');
    sep.className = 'tab-dropdown-sep';
    dd.appendChild(sep);
    const addItem = document.createElement('div');
    addItem.className = 'tab-dropdown-item';
    addItem.innerHTML = '<span class="num">+</span><span class="name" style="color:var(--accent);font-weight:600">Trang mới</span>';
    addItem.addEventListener('click', () => {
      addPage();
      closeTabDropdown();
    });
    dd.appendChild(addItem);
  }

  // Position dropdown
  const r = btn.getBoundingClientRect();
  dd.classList.add('show');
  const ddRect = dd.getBoundingClientRect();
  const left = Math.min(r.left, window.innerWidth - ddRect.width - 8);
  const top = r.bottom + 4;
  dd.style.left = Math.max(8, left) + 'px';
  dd.style.top = top + 'px';
  dd.style.maxHeight = Math.min(window.innerHeight - top - 16, 500) + 'px';
}
function closeTabDropdown() {
  const dd = $('tabDropdown');
  if (dd) dd.classList.remove('show');
}
click('tabDropdownBtn', openTabDropdown);

// Click ngoài dropdown → đóng
document.addEventListener('pointerdown', e => {
  const dd = $('tabDropdown');
  if (!dd || !dd.classList.contains('show')) return;
  if (dd.contains(e.target)) return;
  if (e.target.closest && e.target.closest('#tabDropdownBtn')) return;
  closeTabDropdown();
}, true);

// Escape → đóng
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const dd = $('tabDropdown');
    if (dd && dd.classList.contains('show')) { closeTabDropdown(); e.preventDefault(); }
  }
});

/* ---------- Tab context menu ---------- */
function showTabContextMenu(e, id) {
  const idx = pages.findIndex(p => p.id === id);
  const items = [
    { icon: '✎', label: 'Đổi tên', action: () => renamePage(id) },
    { icon: '⎘', label: 'Nhân bản trang', action: () => duplicatePage(id) },
    { icon: '⊕', label: 'Trang mới (bên phải)', action: () => {
      saveCurrentPage();
      const np = newPage();
      pages.splice(idx + 1, 0, np);
      renderTabs();
      loadPage(np.id);
    }},
    { type: 'sep' },
    { icon: '←', label: 'Đóng các tab bên trái', action: () => closeOtherPages(id, 'left') },
    { icon: '→', label: 'Đóng các tab bên phải', action: () => closeOtherPages(id, 'right') },
    { icon: '✕', label: 'Đóng các tab khác', action: () => closeOtherPages(id, 'all') },
    { type: 'sep' },
    { icon: '✕', label: 'Đóng trang', danger: true, disabled: pages.length <= 1, action: () => removePage(id) },
  ];
  buildCtx(items, e);
}
function closeOtherPages(id, dir) {
  const idx = pages.findIndex(p => p.id === id);
  if (idx < 0) return;
  if (dir === 'all') pages = [pages[idx]];
  else if (dir === 'left') pages = pages.slice(idx);
  else if (dir === 'right') pages = pages.slice(0, idx + 1);
  if (!pages.find(p => p.id === activePageId)) activePageId = pages[0].id;
  const active = pages.find(p => p.id === activePageId);
  nodes = active.nodes; edges = active.edges;
  view.x = active.view.x; view.y = active.view.y; view.k = active.view.k;
  renderTabs();
  render();
  toast('Đã đóng tab', 'success');
}

const _mctx = document.createElement('canvas').getContext('2d');
function setMeasureFont(fontSize, weight, style) {
  _mctx.font = ((style || '') + ' ' + (weight || 500) + ' ' + fontSize + 'px ' + FONT).trim();
}
function wrapText(text, maxWidth, fontSize, weight, style) {
  setMeasureFont(fontSize, weight, style);
  const out = [];
  String(text ?? '').split('\n').forEach(para => {
    if (!para) { out.push(''); return; }
    const words = para.split(/\s+/);
    let line = '';
    for (let wi = 0; wi < words.length; wi++) {
      const w = words[wi];
      const test = line ? line + ' ' + w : w;
      if (_mctx.measureText(test).width > maxWidth) {
        if (line) { out.push(line); line = ''; }
        if (_mctx.measureText(w).width > maxWidth) {
          let chunk = '';
          for (let ci = 0; ci < w.length; ci++) {
            const ch = w[ci];
            const t = chunk + ch;
            if (_mctx.measureText(t).width > maxWidth && chunk) { out.push(chunk); chunk = ch; }
            else chunk = t;
          }
          line = chunk;
        } else line = w;
      } else line = test;
    }
    if (line) out.push(line);
  });
  return out.length ? out : [''];
}
function computeTextLayout(n) {
  if (!n.text || !n.text.length) return null;
  const weight = n.bold ? 700 : 500;
  const fstyle = n.italic ? 'italic' : '';
  const pad = shapeInnerPad(n.type, n.w, n.h);
  const maxW = Math.max(16, n.w - pad * 2);
  const maxH = Math.max(12, n.h - pad * 2);
  let fs = clamp(n.fontSize || 14, MIN_FONT, MAX_FONT);
  let lines = [];
  if (n.autoFit !== false) {
    let guard = 0;
    while (fs > MIN_FONT && guard++ < 300) {
      lines = wrapText(n.text, maxW, fs, weight, fstyle);
      setMeasureFont(fs, weight, fstyle);
      let maxLineW = 0;
      for (let i = 0; i < lines.length; i++) {
        const w = _mctx.measureText(lines[i]).width;
        if (w > maxLineW) maxLineW = w;
      }
      const lineH = fs * 1.28;
      const totalH = lines.length * lineH;
      if (totalH <= maxH && maxLineW <= maxW + 0.5) break;
      fs -= 0.5;
    }
    if (fs < MIN_FONT) fs = MIN_FONT;
  }
  lines = wrapText(n.text, maxW, fs, weight, fstyle);
  let lineH = fs * 1.3;
  const needed = lines.length * lineH;
  if (needed > maxH && lines.length > 1) lineH = Math.max(fs * 0.9, maxH / lines.length);
  return { fs, lines, weight, fstyle, lineH };
}

function portPos(n, side) {
  switch (side) {
    case 'top':    return { x: n.x + n.w / 2, y: n.y };
    case 'right':  return { x: n.x + n.w,     y: n.y + n.h / 2 };
    case 'bottom': return { x: n.x + n.w / 2, y: n.y + n.h };
    case 'left':   return { x: n.x,           y: n.y + n.h / 2 };
  }
  return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
}
function autoSides(a, b) {
  const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
  const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
  if (Math.abs(dx) > Math.abs(dy) * 1.15) return dx > 0 ? ['right', 'left'] : ['left', 'right'];
  return dy > 0 ? ['bottom', 'top'] : ['top', 'bottom'];
}
function shiftPt(p, side, d) {
  switch (side) {

    case 'bottom': return { x: p.x, y: p.y + d };

function buildEdgePath(p1, s1, p2, s2, routing) {

  }
  if (routing === 'orthogonal') {
    const gap = 28;
    const e1 = shiftPt(p1, s1, gap);
    const e2 = shiftPt(p2, s2, gap);
    const h1 = s1 === 'left' || s1 === 'right';
    const h2 = s2 === 'left' || s2 === 'right';
    const pts = [p1, e1];
    if (h1 && h2) { const mx = (e1.x + e2.x) / 2; pts.push({ x: mx, y: e1.y }, { x: mx, y: e2.y }); }
    else if (!h1 && !h2) { const my = (e1.y + e2.y) / 2; pts.push({ x: e1.x, y: my }, { x: e2.x, y: my }); }
    else if (h1) pts.push({ x: e2.x, y: e1.y });
    else pts.push({ x: e1.x, y: e2.y });
    pts.push(e2, p2);
    const filt = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const l = filt[filt.length - 1];
      if (Math.abs(pts[i].x - l.x) > 0.5 || Math.abs(pts[i].y - l.y) > 0.5) filt.push(pts[i]);
    }
    let dstr = 'M ' + filt[0].x + ' ' + filt[0].y;
    for (let i = 1; i < filt.length; i++) dstr += ' L ' + filt[i].x + ' ' + filt[i].y;
    let totalLen = 0;
    for (let i = 1; i < filt.length; i++) totalLen += Math.hypot(filt[i].x - filt[i - 1].x, filt[i].y - filt[i - 1].y);
    let acc = 0, mid = filt[0];
    for (let i = 1; i < filt.length; i++) {
      const seg = Math.hypot(filt[i].x - filt[i - 1].x, filt[i].y - filt[i - 1].y);
      if (acc + seg >= totalLen / 2) {
        const t = (totalLen / 2 - acc) / seg;
        mid = { x: filt[i - 1].x + (filt[i].x - filt[i - 1].x) * t, y: filt[i - 1].y + (filt[i].y - filt[i - 1].y) * t };

    d: 'M ' + p1.x + ' ' + p1.y + ' C ' + c1.x + ' ' + c1.y + ' ' + c2.x + ' ' + c2.y + ' ' + p2.x + ' ' + p2.y,
    mid: { x: (p1.x + 3 * c1.x + 3 * c2.x + p2.x) / 8, y: (p1.y + 3 * c1.y + 3 * c2.y + p2.y) / 8 }

}

function makeNodeEl(n) {

      stroke: n.stroke, 'stroke-width': n.strokeWidth || 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round'

  nodes.forEach(n => { anchorX += n.x + n.w / 2; });
  anchorX = anchorX / nodes.length || 0;
  let curY = 0;
  sortedKeys.forEach(k => {

    const totalW = arr.reduce((s, n) => s + n.w, 0) + (arr.length - 1) * colGap;
    let curX = anchorX - totalW / 2;
    arr.forEach(n => {
      n.x = Math.round(curX);
      n.y = Math.round(curY + (maxH - n.h) / 2);
      curX += n.w + colGap;
    });
    curY += maxH + rowGap;

function autoLayoutGrid() {
  if (!nodes.length) return;
  const cols = Math.ceil(Math.sqrt(nodes.length));
  const colGap = 40, rowGap = 40;
  let maxW = 0, maxH = 0;
  nodes.forEach(n => { maxW = Math.max(maxW, n.w); maxH = Math.max(maxH, n.h); });
  nodes.forEach((n, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    n.x = c * (maxW + colGap);
    n.y = r * (maxH + rowGap);
  });
  render(); pushHistory();
  setTimeout(fitView, 60);
  toast('Đã xếp dạng lưới', 'success');
}

function exportMermaid() {
  if (!nodes.length) { toast('Chưa có nội dung', 'warning'); return; }
  const idMap = new Map();
  nodes.forEach((n, i) => idMap.set(n.id, 'N' + i));
  let s = 'flowchart TD\n';
  nodes.forEach(n => {
    const id = idMap.get(n.id);
    const rawLabel = (n.text || '').replace(/[\r\n]+/g, ' ').replace(/"/g, "'").trim();
    const label = rawLabel || ' ';
    let open = '[', close = ']';
    switch (n.type) {
      case 'oval': case 'circle': open = '(['; close = '])'; break;
      case 'diamond': open = '{'; close = '}'; break;
      case 'parallelogram': open = '[/'; close = '/]'; break;
      case 'hexagon': open = '{{'; close = '}}'; break;
      case 'cylinder': open = '[('; close = ')]'; break;
      case 'predefined': open = '[['; close = ']]'; break;
      case 'offpage': case 'annotation': open = '>'; close = ']'; break;
      case 'or_node': case 'summing': case 'merge': open = '(('; close = '))'; break;
    }
    s += '    ' + id + open + '"' + label + '"' + close + '\n';
  });
  edges.forEach(e => {
    const f = idMap.get(e.from), t = idMap.get(e.to);
    if (!f || !t) return;
    const lab = e.label ? '|"' + e.label.replace(/["\n|]/g, '') + '"|' : '';
    let arr = '-->';
    if (e.dashed) arr = '-.->';
    if (e.arrowEnd === false) arr = e.dashed ? '-.-' : '---';
    s += '    ' + f + ' ' + arr + lab + ' ' + t + '\n';
  });
  const styleGroups = new Map();
  nodes.forEach(n => {
    const key = n.fill + '|' + n.stroke;
    if (!styleGroups.has(key)) styleGroups.set(key, []);
    styleGroups.get(key).push(idMap.get(n.id));
  });
  let i = 0;
  styleGroups.forEach((ids, key) => {
    const parts = key.split('|');
    const cls = 's' + (i++);
    s += '    classDef ' + cls + ' fill:' + parts[0] + ',stroke:' + parts[1] + ',color:#1e2433;\n';
    s += '    class ' + ids.join(',') + ' ' + cls + ';\n';
  });
  downloadBlob(new Blob([s], { type: 'text/plain;charset=utf-8' }), 'fwrt-flowchart.mmd');
  toast('Đã xuất Mermaid', 'success');
}

    e.preventDefault();
    const id = nodeEl.dataset.id;
    const alreadySelected = selected.nodes.has(id) && selected.nodes.size === 1;

    if (e.shiftKey) {
      if (selected.nodes.has(id)) selected.nodes.delete(id);
      else selected.nodes.add(id);
    } else if (!selected.nodes.has(id)) {
      clearSelection();
      selected.nodes.add(id);

    selected.edges.clear();

    if (e.altKey && selected.nodes.size) duplicateSelection();

    drag = {
      type: 'node', start: toWorld(e), moved: false,
      pendingEditId: (alreadySelected && !e.shiftKey) ? id : null,
      origins: [...selected.nodes].map(i => { const n = getNode(i); return { id: i, x: n.x, y: n.y }; })

    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;

        currentGuides = computeGuides(draggedNodes);
        if (currentGuides.length && !snapToGrid) {
          const threshold = 5;
          draggedNodes.forEach(dn => {
            currentGuides.forEach(gd => {

                [dn.x, dn.x + dn.w / 2, dn.x + dn.w].forEach(v => { if (Math.abs(v - gd.x) < threshold) dn.x += gd.x - v; });

    const o = drag.orig;
    let x = o.x, y = o.y, w = o.w, h = o.h;
    if (drag.handle.indexOf('e') >= 0) w = Math.max(30, o.w + dx);
    if (drag.handle.indexOf('s') >= 0) h = Math.max(30, o.h + dy);
    if (drag.handle.indexOf('w') >= 0) { w = Math.max(30, o.w - dx); x = o.x + (o.w - w); }
    if (drag.handle.indexOf('n') >= 0) { h = Math.max(30, o.h - dy); y = o.y + (o.h - h); }
    if (snapToGrid) {
      x = Math.round(x / GRID) * GRID; y = Math.round(y / GRID) * GRID;

        if (dist > 30) {

          if (snapToGrid) { nn.x = Math.round(nn.x / GRID) * GRID; nn.y = Math.round(nn.y / GRID) * GRID; }
          addEdge(d.from, nn.id, d.fromSide, 'auto');
          clearSelection();
          selected.nodes.add(nn.id);
          pushHistory();
        }
      }
    }
    render();
    return;
  }
  if (d.type === 'rubber') {
    const r = d.rect;
    const rx1 = Math.min(r.x1, r.x2), rx2 = Math.max(r.x1, r.x2);
    const ry1 = Math.min(r.y1, r.y2), ry2 = Math.max(r.y1, r.y2);
    if (rx2 - rx1 > 4 || ry2 - ry1 > 4) {
      if (!d.additive) clearSelection();
      nodes.forEach(n => {
        if (n.x < rx2 && n.x + n.w > rx1 && n.y < ry2 && n.y + n.h > ry1) selected.nodes.add(n.id);

function addEdge(from, to, fromSide, toSide) {
  if (from === to) return;
  const dup = edges.find(e => e.from === from && e.to === to &&
    (e.fromSide || 'auto') === (fromSide || 'auto') &&
    (e.toSide || 'auto') === (toSide || 'auto'));
  if (dup) return;
  edges.push({
    id: uid(), from, to,
    fromSide: fromSide || 'auto', toSide: toSide || 'auto',
    label: '', color: '#7c869e', width: 2, dashed: false,
    arrowEnd: true, arrowStart: false, arrowStyle: 'solid', routing: 'curve'
  });
}

if (svg) {
  svg.addEventListener('dblclick', e => {
    const nodeEl = closestOf(e.target, '.node');
    if (nodeEl) {
      const n = getNode(nodeEl.dataset.id);
      if (n && !n.locked) {
        if (!selected.nodes.has(n.id) || selected.nodes.size !== 1) {
          clearSelection();
          selected.nodes.add(n.id);
          selected.edges.clear();
          render();
        }

function focusInspectorText(nodeId) {
  const n = getNode(nodeId);
  if (!n) return;
  const ta = $('i-text');
  if (!ta || ta.dataset.nodeId !== nodeId) {
    updateInspector();
  }
  requestAnimationFrame(() => {
    const ta2 = $('i-text');
    if (ta2 && ta2.dataset.nodeId === nodeId) {
      if (inspector) inspector.scrollTop = 0;
      ta2.focus();
      ta2.select();
      ta2.classList.remove('flash-focus');
      void ta2.offsetWidth;
      ta2.classList.add('flash-focus');
    }
  });
}

if (canvasWrap) {
  canvasWrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvasWrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const oldK = view.k;
    const factor = Math.exp(-e.deltaY * 0.0016);
    const k = clamp(oldK * factor, 0.12, 4);
    view.x = mx - (mx - view.x) * (k / oldK);
    view.y = my - (my - view.y) * (k / oldK);
    view.k = k;
    render(true);
  }, { passive: false });
}

let cmdFiltered = COMMANDS;
let cmdActiveIdx = 0;
function openCmd() {
  if (!cmdOverlay) return;
  cmdOverlay.classList.add('show');
  if (cmdInput) cmdInput.value = '';
  filterCmd('');
  setTimeout(() => { if (cmdInput) cmdInput.focus(); }, 30);
}
function closeCmd() { if (cmdOverlay) cmdOverlay.classList.remove('show'); }
function filterCmd(q) {
  q = q.trim().toLowerCase();
  if (!q) cmdFiltered = COMMANDS;
  else cmdFiltered = COMMANDS.filter(c => {
    if (c.type === 'sep') return false;
    return c.label.toLowerCase().indexOf(q) >= 0 ||
           (c.shortcut && c.shortcut.toLowerCase().indexOf(q) >= 0);
  });
  cmdActiveIdx = 0;
  renderCmdList();
}
function renderCmdList() {
  if (!cmdList) return;
  cmdList.innerHTML = '';
  if (!cmdFiltered.length) {
    cmdList.innerHTML = '<div class="cmd-empty">Không tìm thấy lệnh phù hợp</div>';
    return;
  }
  cmdFiltered.forEach((c, i) => {
    if (c.type === 'sep') return;
    const el = document.createElement('div');
    el.className = 'cmd-item' + (i === cmdActiveIdx ? ' active' : '');
    el.innerHTML = '<span class="cmd-icon">' + (c.icon || '') + '</span>' +
      '<span class="cmd-label">' + esc(c.label) + '</span>' +
      (c.shortcut ? '<span class="cmd-shortcut">' + c.shortcut + '</span>' : '');
    el.addEventListener('click', () => { closeCmd(); c.action(); });
    el.addEventListener('mouseenter', () => {
      cmdActiveIdx = i;
      Array.prototype.forEach.call(cmdList.querySelectorAll('.cmd-item'), (n, j) => {
        n.classList.toggle('active', j === i);
      });
    });
    cmdList.appendChild(el);
  });
}
if (cmdInput) {
  cmdInput.addEventListener('input', e => filterCmd(e.target.value));
  cmdInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeCmd(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); cmdActiveIdx = Math.min(cmdActiveIdx + 1, cmdFiltered.length - 1); renderCmdList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdActiveIdx = Math.max(cmdActiveIdx - 1, 0); renderCmdList(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const c = cmdFiltered[cmdActiveIdx];
      if (c && c.action) { closeCmd(); c.action(); }
    }
  });
}
if (cmdOverlay) cmdOverlay.addEventListener('click', e => { if (e.target === cmdOverlay) closeCmd(); });

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = (tag === 'input' || tag === 'textarea' || tag === 'select');
  if (e.key === 'Escape') {
    if ($('tabDropdown') && $('tabDropdown').classList.contains('show')) { closeTabDropdown(); e.preventDefault(); return; }
    if ($('dlgModal') && $('dlgModal').classList.contains('show')) { cancelDialog(); e.preventDefault(); return; }
    if (cmdOverlay && cmdOverlay.classList.contains('show')) { closeCmd(); e.preventDefault(); return; }
    if (searchPanel && searchPanel.classList.contains('show')) { closeSearch(); e.preventDefault(); return; }
  }
  if (inField) { if (e.key === 'Escape') e.target.blur(); return; }
  const ctrl = e.ctrlKey || e.metaKey, shift = e.shiftKey, alt = e.altKey;
  if (ctrl && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if (ctrl && e.key.toLowerCase() === 'b') { e.preventDefault(); togglePalette(); return; }
  if (ctrl && shift && e.key === 'Tab') { e.preventDefault(); openTabDropdown(); return; }
  if (ctrl && e.key === 'Tab') { e.preventDefault(); if (shift) prevPage(); else nextPage(); return; }
  if (ctrl && !shift && !alt && e.key >= '1' && e.key <= '9') {
    const i = parseInt(e.key, 10) - 1;
    if (i < pages.length) { e.preventDefault(); gotoPageIndex(i); return; }
  }
  if (e.code === 'Space') { spaceDown = true; e.preventDefault(); return; }
  if (ctrl && e.key.toLowerCase() === 'z' && !shift) { e.preventDefault(); undo(); return; }
  if (ctrl && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && shift))) { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === 'd' && !shift && !alt) { e.preventDefault(); duplicateSelection(); return; }
  if (ctrl && shift && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicatePage(activePageId); return; }
  if (ctrl && !alt && e.key.toLowerCase() === 'a') { e.preventDefault(); selectAll(); return; }
  if (ctrl && !alt && e.key.toLowerCase() === 'c') { e.preventDefault(); copySelection(); return; }
  if (ctrl && !alt && e.key.toLowerCase() === 'x') { e.preventDefault(); cutSelection(); return; }
  if (ctrl && !alt && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteClipboard(); return; }
  if (ctrl && alt && e.key.toLowerCase() === 'c') { e.preventDefault(); copyFormat(); return; }
  if (ctrl && alt && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteFormat(); return; }
  if (ctrl && e.key.toLowerCase() === 'f') { e.preventDefault(); openSearch(); return; }
  if (ctrl && e.key.toLowerCase() === 't') { e.preventDefault(); addPage(); return; }
  if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); saveJSON(); return; }
  if (ctrl && e.key.toLowerCase() === 'p') { e.preventDefault(); printFlowchart(); return; }
  if (ctrl && e.key === '0') { e.preventDefault(); if (shift) zoomToSelection(); else fitView(); return; }
  if (ctrl && e.key === '=') { e.preventDefault(); zoomBy(1.2); return; }
  if (ctrl && e.key === '-') { e.preventDefault(); zoomBy(1 / 1.2); return; }
  if (e.key === 'F11') { e.preventDefault(); toggleFullscreen(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0 && selected.nodes.size) {
    e.preventDefault();
    const step = shift ? 1 : (snapToGrid ? GRID : 10);
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    selected.nodes.forEach(id => { const n = getNode(id); if (n && !n.locked) { n.x += dx; n.y += dy; } });
    render(true);
    clearTimeout(window.__nudgeTimer);
    window.__nudgeTimer = setTimeout(pushHistory, 400);
  }
});

function downloadBlob(blob, filename) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  } catch (err) { toast('Không thể tải file: ' + err.message, 'danger'); }
}
function contentBounds() {
  if (!nodes.length) return { x: 0, y: 0, w: 900, h: 640 };
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  });
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}
function buildExportSVG() {
  const pad = 44;
  const b = contentBounds();
  const W = b.w + pad * 2, H = b.h + pad * 2;
  const cloneEdges = edgesLayer.cloneNode(true);
  const cloneNodes = nodesLayer.cloneNode(true);
  [cloneEdges, cloneNodes].forEach(layer => {
    layer.querySelectorAll('.port,.handle,.sel-outline,.target-highlight,.lock-badge').forEach(el => el.remove());
    layer.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
  });
  const out = svgEl('svg', { xmlns: NS, width: W, height: H, viewBox: (b.x - pad) + ' ' + (b.y - pad) + ' ' + W + ' ' + H });
  out.appendChild(svgEl('rect', { x: b.x - pad, y: b.y - pad, width: W, height: H, fill: '#ffffff' }));
  out.appendChild(defs.cloneNode(true));
  const g = svgEl('g');
  g.appendChild(cloneEdges);
  g.appendChild(cloneNodes);
  out.appendChild(g);
  return { svg: out, W, H };
}
function exportSVGFile() {
  if (!nodes.length) { toast('Chưa có nội dung', 'warning'); return; }
  const r = buildExportSVG();
  const str = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(r.svg);
  downloadBlob(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }), 'fwrt-flowchart.svg');
  toast('Đã xuất SVG', 'success');
}
function exportPNG(transparent) {
  if (!nodes.length) { toast('Chưa có nội dung', 'warning'); return; }
  const r = buildExportSVG();
  if (transparent) {
    const rect = r.svg.querySelector('rect');
    if (rect) rect.remove();
  }
  const str = new XMLSerializer().serializeToString(r.svg);
  const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const c = document.createElement('canvas');
    c.width = Math.round(r.W * scale);
    c.height = Math.round(r.H * scale);
    const ctx = c.getContext('2d');
    if (!transparent) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); }
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(blob => { downloadBlob(blob, 'fwrt-flowchart.png'); toast('Đã xuất PNG', 'success'); }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Không thể xuất PNG', 'danger'); };
  img.src = url;
}

function migrateNode(n) {

    terminator: 'oval', process: 'rect', decision: 'diamond', io: 'parallelogram',
    preparation: 'hexagon', manual: 'trapezoid', connector: 'circle', database: 'cylinder'
  };
  if (keyMap[n.type]) n.type = keyMap[n.type];
  n.fill = n.fill || '#dbeafe';
  n.stroke = n.stroke || '#2563eb';
  n.textColor = n.textColor || '#1e2433';
  n.fontSize = n.fontSize || 14;
  n.strokeWidth = n.strokeWidth == null ? 2 : n.strokeWidth;
  if (n.bold === undefined) n.bold = false;
  if (n.italic === undefined) n.italic = false;
  if (n.autoFit === undefined) n.autoFit = true;
  if (!n.hAlign) n.hAlign = 'center';
  if (!n.vAlign) n.vAlign = 'middle';

}
